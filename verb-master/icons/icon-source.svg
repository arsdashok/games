<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Placeholder icon. Replace with a proper-designed icon before launch.
       Export as 192/512 PNG via inkscape, figma, or online tools.
       For maskable: pad the central design to ~80% of viewport (currently does this). -->

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>

  <!-- Maskable-safe background (full viewport) -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Lightning bolt motif (energetic, study/speed-game feel) -->
  <g transform="translate(256 256)">
    <path d="M -30 -130 L 30 -130 L 0 -20 L 60 -20 L -30 130 L 0 20 L -60 20 Z"
          fill="url(#text)"
          stroke="rgba(0,0,0,0.15)"
          stroke-width="3"
          stroke-linejoin="round"/>
  </g>

  <!-- 'V' badge in corner -->
  <text x="256" y="450"
        font-family="-apple-system, Segoe UI, sans-serif"
        font-size="70"
        font-weight="900"
        text-anchor="middle"
        fill="#ffffff"
        opacity="0.95">VERB</text>
</svg>
