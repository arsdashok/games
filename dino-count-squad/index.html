<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Number Squad</title>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:'Andika','Comic Sans MS',sans-serif; background:linear-gradient(180deg,#bfe9ff 0%,#d9f7e6 55%,#c8efb0 100%); color:#1f2937; overflow:hidden; user-select:none; }
.screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:12px; }
.hidden { display:none !important; }

#start h1 { font-size:clamp(30px,6.2vw,56px); color:#7c3aed; text-align:center; line-height:1.1; }
#start .sub { font-size:clamp(15px,3.2vw,22px); color:#475569; font-weight:700; text-align:center; }
.mode-row { display:flex; gap:18px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
.mode-btn { font-family:inherit; cursor:pointer; border:none; border-radius:22px; padding:20px 24px; color:white; box-shadow:0 6px 0 rgba(0,0,0,0.18); transition:transform .08s; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:250px; background:linear-gradient(135deg,#2e9e4f 0%,#2e9e4f 50%,#cc3333 50%,#cc3333 100%); }
.mode-btn .t { font-size:clamp(20px,3.6vw,28px); font-weight:700; }
.mode-btn .ex { font-size:clamp(13px,2.5vw,17px); font-weight:700; opacity:.96; }
.mode-btn:active { transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
.legend { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
.legend .chip { padding:10px 16px; border-radius:14px; border:3px solid; font-weight:700; font-size:clamp(13px,2.5vw,17px); }
.legend .plus { background:#E8F5E9; border-color:#2E7D32; color:#2E7D32; }
.legend .minus { background:#FDECEA; border-color:#CC3333; color:#CC3333; }
.start-dinos { display:flex; gap:10px; margin-top:12px; }
.start-dinos img { width:clamp(46px,9.5vw,78px); height:auto; }

#game { justify-content:flex-start; padding-top:14px; gap:14px; }
.hud { width:100%; max-width:1040px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.back-btn { font-family:inherit; cursor:pointer; border:3px solid #94a3b8; background:white; border-radius:16px; padding:8px 16px; font-size:18px; font-weight:700; color:#475569; }
.score { font-size:clamp(18px,3.4vw,26px); font-weight:700; color:#92400e; background:#FFF7D6; border:3px solid #f0a500; border-radius:16px; padding:8px 18px; white-space:nowrap; }
.qbanner { width:100%; max-width:1040px; text-align:center; background:white; border-radius:20px; padding:16px; box-shadow:0 5px 0 rgba(0,0,0,0.12); font-size:clamp(22px,4.2vw,38px); font-weight:700; color:#334155; border:5px solid #e5e7eb; min-height:92px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap; }
.qbanner.plus { border-color:#2E7D32; } .qbanner.minus { border-color:#CC3333; }
.qbanner b.more { color:#2E7D32; } .qbanner b.less { color:#CC3333; }
.qbanner .op.plus { color:#2E7D32; } .qbanner .op.minus { color:#CC3333; }
.speaker { cursor:pointer; font-size:clamp(24px,4vw,38px); background:none; border:none; }
/* big start number */
.focus-card { display:inline-flex; align-items:center; justify-content:center; min-width:1.3em; padding:6px 18px; border-radius:16px; color:white; font-size:1.25em; box-shadow:4px 4px 0 rgba(0,0,0,0.2); }
.focus-card.plus { background:#2E7D32; } .focus-card.minus { background:#CC3333; }
/* mode 1: make the START number big and dominant */
#game.seq .focus-card { font-size:clamp(52px,9.5vw,92px); padding:8px 24px; border-radius:20px; }

/* Options (mode 1) — smaller than the start number */
.options { width:100%; max-width:1040px; display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:10px; }
.opt { font-family:inherit; cursor:pointer; border:4px solid #334155; border-radius:18px; background:white; width:clamp(78px,14vw,116px); height:clamp(78px,13vh,116px); font-size:clamp(32px,6vw,50px); font-weight:700; color:#1f2937; transition:transform .1s; }
.opt:active { transform:scale(.95); }
.opt.correct { border-color:#16a34a; background:#dcfce7; }

/* Number-line board (modes 2 & 3) — single row, clickable */
.board { width:100%; max-width:1040px; display:flex; gap:6px; justify-content:center; margin-top:6px; }
.board .cell { flex:1; max-width:96px; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:clamp(20px,3.8vw,40px); font-weight:700; color:#1f2937; background:white; border:3px solid #334155; border-radius:12px; cursor:pointer; transition:transform .1s; position:relative; }
.board .cell:active { transform:scale(.94); }
.board .cell.base { border-color:#2563eb; border-style:dashed; box-shadow:0 0 0 4px rgba(37,99,235,0.16); }
.board .cell.base::before { content:'start'; position:absolute; top:2px; left:0; right:0; font-size:9px; color:#2563eb; font-weight:700; }
.board .cell.correct { border-color:#16a34a; background:#dcfce7; }

@keyframes wob { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-7deg)} 40%{transform:rotate(6deg)} 60%{transform:rotate(-5deg)} 80%{transform:rotate(4deg)} }
.wobble { animation:wob .4s; }
@keyframes pop { 0%{transform:scale(1)} 45%{transform:scale(1.14)} 100%{transform:scale(1)} }
.pop { animation:pop .4s; }

.show-row-btn { font-family:inherit; cursor:pointer; border:3px dashed #6366f1; background:#eef2ff; color:#4338ca; border-radius:16px; padding:8px 18px; font-size:clamp(14px,2.6vw,18px); font-weight:700; margin-top:2px; }
.numrow { width:100%; max-width:1040px; display:flex; gap:5px; justify-content:center; }
.numrow .cell { flex:1; max-width:80px; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:clamp(16px,3.2vw,28px); font-weight:700; color:#2E75B6; background:white; border:2.5px solid #9cc3e6; border-radius:10px; }

#win h1 { font-size:clamp(38px,8vw,70px); color:#16a34a; text-align:center; }
#win .sub { font-size:clamp(18px,3.6vw,26px); font-weight:700; color:#475569; text-align:center; }
.win-dinos { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:8px 0; }
.win-dinos img { width:clamp(54px,12vw,96px); height:auto; animation:dance 1s ease-in-out infinite; }
@keyframes dance { 0%,100%{transform:translateY(0) rotate(-4deg)} 50%{transform:translateY(-14px) rotate(4deg)} }
.win-dinos img:nth-child(2){animation-delay:.15s} .win-dinos img:nth-child(3){animation-delay:.3s} .win-dinos img:nth-child(4){animation-delay:.45s} .win-dinos img:nth-child(5){animation-delay:.6s}
.win-btns { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
.win-btn { font-family:inherit; cursor:pointer; border:none; border-radius:18px; padding:16px 24px; font-size:clamp(16px,3vw,22px); font-weight:700; color:white; box-shadow:0 5px 0 rgba(0,0,0,0.18); }
.win-btn:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,0.18); }
.wb-again { background:#2e9e4f; } .wb-other { background:#e8650c; } .wb-menu { background:#6366f1; }
.confetti { position:fixed; width:11px; height:14px; border-radius:3px; pointer-events:none; z-index:99; animation:fall 1.1s ease-out forwards; }
@keyframes fall { 0%{transform:translate(0,0) rotate(0); opacity:1;} 100%{transform:translate(var(--dx),calc(var(--dy)+320px)) rotate(540deg); opacity:0;} }
</style>
</head>
<body>

<div id="start" class="screen">
  <h1>🦖 Dino Number Squad 🦕</h1>
  <div class="sub">Listen, then tap the right answer! 🧠</div>
  <div class="mode-row">
    <button class="mode-btn" onclick="startGame('seq')"><span class="t">What comes Next? / Before?</span><span class="ex">tap the answer from your head</span></button>
    <button class="mode-btn" onclick="startGame('words')"><span class="t">One more / One less</span><span class="ex">tap it on the number row</span></button>
    <button class="mode-btn" onclick="startGame('eq')"><span class="t">Plus 1 / Minus 1</span><span class="ex">tap it on the number row</span></button>
  </div>
  <div class="legend">
    <div class="chip plus">👉 next · one more · +1</div>
    <div class="chip minus">👈 before · one less · −1</div>
  </div>
  <div class="start-dinos" id="startDinos"></div>
</div>

<div id="game" class="screen hidden">
  <div class="hud">
    <button class="back-btn" onclick="goMenu()">⬅ Menu</button>
    <div class="score" id="score">⭐ 0 / 10</div>
  </div>
  <div class="qbanner" id="qbanner"><button class="speaker" id="speaker" onclick="repeatQ()" title="Say again">🔊</button><span id="qtext">Ready?</span></div>
  <div class="options hidden" id="options"></div>
  <button class="show-row-btn hidden" id="showRowBtn" onclick="toggleRow()">🔢 Show number row</button>
  <div class="numrow hidden" id="numrow"></div>
  <div class="board hidden" id="board"></div>
</div>

<div id="win" class="screen hidden">
  <h1>🏆 You did it! 🏆</h1>
  <div class="sub" id="winSub">10 out of 10!</div>
  <div class="win-dinos" id="winDinos"></div>
  <div class="win-btns">
    <button class="win-btn wb-again" onclick="startGame(mode)">Play again</button>
    <button class="win-btn wb-other" onclick="startGame(mode==='seq'?'words':mode==='words'?'eq':'seq')">Other game</button>
    <button class="win-btn wb-menu" onclick="goMenu()">Menu</button>
  </div>
</div>

const TOTAL=10;
let mode='seq', score=0, q=null, locked=false, lastSpeak='', audioCtx=null, chosenVoice=null;

(function(){ const sd=document.getElementById('startDinos'); DINOS.forEach(u=>{const i=document.createElement('img');i.src=u;sd.appendChild(i);}); const wd=document.getElementById('winDinos'); DINOS.forEach(u=>{const i=document.createElement('img');i.src=u;wd.appendChild(i);}); })();

/* ---- nicer (female) voice ---- */
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  const prefer=[/samantha/i,/karen/i,/serena/i,/moira/i,/tessa/i,/fiona/i,/google uk english female/i,/google us english/i,/zira/i,/female/i];
  for(const re of prefer){ const v=vs.find(v=>/^en/i.test(v.lang)&&re.test(v.name)); if(v){ chosenVoice=v; return; } }
  chosenVoice=vs.find(v=>/^en/i.test(v.lang))||vs[0];
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }

function rand(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function initAudio(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(audioCtx&&audioCtx.state==='suspended'){ audioCtx.resume(); } }
function beep(f,d,t){ d=d||0.15; t=t||'sine'; if(!audioCtx) return; let tt=audioCtx.currentTime; f.forEach((fr,i)=>{const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type=t;o.frequency.value=fr;o.connect(g);g.connect(audioCtx.destination);const s=tt+i*d;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.28,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d);}); }
function speak(text,rate,pitch){ if(!('speechSynthesis' in window)) return; try{ const u=new SpeechSynthesisUtterance(text); u.rate=rate||0.9; u.pitch=pitch||1.1; if(chosenVoice) u.voice=chosenVoice; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function say(text){ lastSpeak=text; speak(text); }
function repeatQ(){ if(lastSpeak) speak(lastSpeak); }

function buildNumRow(){ const row=document.getElementById('numrow'); row.innerHTML=''; for(let n=1;n<=10;n++){ const c=document.createElement('div'); c.className='cell'; c.textContent=n; row.appendChild(c); } }
function toggleRow(){ const row=document.getElementById('numrow'); const btn=document.getElementById('showRowBtn'); if(row.classList.contains('hidden')){ row.classList.remove('hidden'); btn.textContent='🙈 Hide number row'; } else { row.classList.add('hidden'); btn.textContent='🔢 Show number row'; } }

function buildBoard(){ const board=document.getElementById('board'); board.innerHTML=''; for(let n=1;n<=10;n++){ const c=document.createElement('button'); c.className='cell'; c.dataset.num=n; c.textContent=n; c.addEventListener('click',()=>onAnswer(n,c)); board.appendChild(c); } }
function clearBoardMarks(){ document.querySelectorAll('#board .cell').forEach(c=>c.classList.remove('base','correct','wobble','pop')); }
function markBase(n){ const c=document.querySelector('#board .cell[data-num="'+n+'"]'); if(c) c.classList.add('base'); }

function startGame(m){
  initAudio(); mode=m; score=0; updateScore();
  const isSeq=(m==='seq');
  document.getElementById('game').classList.toggle('seq',isSeq);
  document.getElementById('options').classList.toggle('hidden',!isSeq);
  document.getElementById('showRowBtn').classList.toggle('hidden',!isSeq);
  document.getElementById('numrow').classList.add('hidden');
  document.getElementById('showRowBtn').textContent='🔢 Show number row';
  document.getElementById('board').classList.toggle('hidden',isSeq);
  if(isSeq){ buildNumRow(); } else { buildBoard(); }
  showScreen('game'); nextQuestion();
}
function goMenu(){ if('speechSynthesis' in window){ try{speechSynthesis.cancel();}catch(e){} } showScreen('start'); }
function updateScore(){ document.getElementById('score').textContent='⭐ '+score+' / '+TOTAL; }

function buildOptions(correct,focus,dir){ const opts=new Set([correct]); const wd=focus-dir; if(wd>=1&&wd<=10&&wd!==correct) opts.add(wd); while(opts.size<3){ opts.add(rand(1,10)); } return shuffle([...opts]); }
function renderOptions(arr){ const box=document.getElementById('options'); box.innerHTML=''; arr.forEach(n=>{ const b=document.createElement('button'); b.className='opt'; b.textContent=n; b.addEventListener('click',()=>onAnswer(n,b)); box.appendChild(b); }); }

function nextQuestion(){
  locked=false;
  const banner=document.getElementById('qbanner'); const qt=document.getElementById('qtext');
  let base,ans,dir,cls,promptHTML,speakTxt;
  if(mode==='seq'){
    if(Math.random()<0.5){ base=rand(1,9); ans=base+1; dir=1; cls='plus'; promptHTML='What comes <b class="more">NEXT</b> after <span class="focus-card plus">'+base+'</span> →'; speakTxt='What comes next after '+base+'?'; }
    else { base=rand(2,10); ans=base-1; dir=-1; cls='minus'; promptHTML='What comes <b class="less">BEFORE</b> <span class="focus-card minus">'+base+'</span> ←'; speakTxt='What comes before '+base+'?'; }
  } else if(mode==='words'){
    if(Math.random()<0.5){ base=rand(1,9); ans=base+1; dir=1; cls='plus'; promptHTML='What is <b class="more">one more</b> than <span class="focus-card plus">'+base+'</span>?'; speakTxt='What is one more than '+base+'?'; }
    else { base=rand(2,10); ans=base-1; dir=-1; cls='minus'; promptHTML='What is <b class="less">one less</b> than <span class="focus-card minus">'+base+'</span>?'; speakTxt='What is one less than '+base+'?'; }
  } else {
    if(Math.random()<0.5){ base=rand(1,9); ans=base+1; dir=1; cls='plus'; promptHTML='<span class="focus-card plus">'+base+'</span> <span class="op plus">+</span> 1 = ?'; speakTxt=base+' plus 1'; }
    else { base=rand(2,10); ans=base-1; dir=-1; cls='minus'; promptHTML='<span class="focus-card minus">'+base+'</span> <span class="op minus">−</span> 1 = ?'; speakTxt=base+' minus 1'; }
  }
  q={ans:ans}; banner.className='qbanner '+cls; qt.innerHTML=promptHTML; say(speakTxt);
  if(mode==='seq'){ renderOptions(buildOptions(ans,base,dir)); }
  else { clearBoardMarks(); markBase(base); }
}

function onAnswer(n,el){
  if(locked) return;
  if(n===q.ans){ locked=true; el.classList.remove('base'); el.classList.add('correct','pop'); beep([660,880]); say(String(n)); confettiAt(el); score++; updateScore(); if(score>=TOTAL){ setTimeout(win,950); } else { setTimeout(nextQuestion,1000); } }
  else { el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble'); beep([150],0.2,'square'); say('Try again'); }
}

function win(){ beep([523,659,784,1047,1319],0.16); speak('Brilliant! Well done!',0.9,1.15); document.getElementById('winSub').textContent=TOTAL+' out of '+TOTAL+'!'; showScreen('win'); bigConfetti(); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
function confettiAt(el){ const r=el.getBoundingClientRect(); spawnConfetti(r.left+r.width/2,r.top+r.height/2,16); }
function bigConfetti(){ for(let i=0;i<6;i++){ setTimeout(()=>spawnConfetti(window.innerWidth*Math.random(),window.innerHeight*0.18,26),i*180); } }
function spawnConfetti(x,y,count){ const colors=['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899']; for(let i=0;i<count;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=x+'px'; c.style.top=y+'px'; c.style.background=colors[i%colors.length]; c.style.setProperty('--dx',((Math.random()-0.5)*240)+'px'); c.style.setProperty('--dy',(Math.random()*-160-40)+'px'); document.body.appendChild(c); setTimeout(()=>c.remove(),1200); } }
</script>
