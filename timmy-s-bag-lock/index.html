<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timmy's Bag — Unlock the Code!</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  overflow: hidden;
}
.container { text-align: center; position: relative; width: 100%; padding: 20px; }

.lock-screen { transition: opacity 0.6s, transform 0.6s; }
.lock-screen.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; position: absolute; left: 0; right: 0; }

.bag-visual {
  width: 160px; height: 130px; margin: 0 auto 16px;
  background: #8B6914; border-radius: 12px 12px 16px 16px;
  position: relative; border: 4px solid #6B4F10;
  box-shadow: 0 8px 30px rgba(0,0,0,0.5);
}
.bag-visual::before {
  content: ''; position: absolute; top: -32px; left: 50%; transform: translateX(-50%);
  width: 90px; height: 40px; border: 5px solid #6B4F10; border-bottom: none;
  border-radius: 50px 50px 0 0;
}
.bag-flap {
  position: absolute; top: -6px; left: -4px; right: -4px; height: 36px;
  background: #9B7918; border-radius: 10px 10px 4px 4px; border: 4px solid #6B4F10;
}

.lock-icon { font-size: 48px; margin-bottom: 8px; animation: shake 2s ease-in-out infinite; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  10% { transform: rotate(-3deg); }
  20% { transform: rotate(3deg); }
  30% { transform: rotate(0); }
}

.title { font-size: 26px; font-weight: 800; color: #ffd700; text-shadow: 0 2px 8px rgba(0,0,0,0.4); margin-bottom: 4px; }
.subtitle { font-size: 14px; color: #a0b4d0; margin-bottom: 24px; }

.code-row { display: flex; gap: 12px; justify-content: center; margin-bottom: 16px; }
.code-box {
  width: 62px; height: 78px; font-size: 38px; font-weight: 900; text-align: center;
  border: 4px solid #3a4a6a; border-radius: 14px;
  background: rgba(255,255,255,0.07); color: #ffd700;
  caret-color: #ffd700; outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
  font-family: 'Courier New', monospace;
}
.code-box:focus { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); transform: scale(1.05); }
.code-box.wrong { border-color: #ff4444; animation: wrongShake 0.4s; box-shadow: 0 0 20px rgba(255,68,68,0.4); }
.code-box.correct { border-color: #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.4); }
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-4px); }
}

.hint { font-size: 13px; color: #6b7fa0; min-height: 20px; transition: color 0.3s; }
.hint.wrong-msg { color: #ff6b6b; font-weight: 600; }
.attempts { margin-top: 8px; font-size: 12px; color: #4a5a7a; }

.unlock-screen {
  opacity: 0; transform: scale(0.5);
  transition: opacity 0.8s, transform 0.8s;
  position: absolute; top: 0; left: 0; right: 0;
  pointer-events: none; display: flex; flex-direction: column; align-items: center; padding: 20px;
}
.unlock-screen.visible { opacity: 1; transform: scale(1); pointer-events: auto; position: relative; }

.sparkles { font-size: 44px; margin-bottom: 8px; animation: sparkle 1s ease-in-out infinite alternate; }
@keyframes sparkle { 0% { transform: scale(1) rotate(-5deg); } 100% { transform: scale(1.1) rotate(5deg); } }

.unlock-title { font-size: 28px; font-weight: 900; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: 6px; }
.unlock-sub { font-size: 15px; color: #a0b4d0; margin-bottom: 20px; }

.map-container {
  max-width: 700px; width: 95%; position: relative;
  animation: mapFloat 3s ease-in-out infinite alternate;
}
@keyframes mapFloat { 0% { transform: translateY(0); } 100% { transform: translateY(-6px); } }

.map-container img {
  width: 100%; border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

.next-msg {
  margin-top: 20px; font-size: 15px; color: #ffd700; font-weight: 600;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.star {
  position: fixed; color: #ffd700; font-size: 20px;
  animation: fall linear forwards; pointer-events: none; z-index: 100;
}
@keyframes fall {
  0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
}
</style>
</head>

<script>
const CODE='4273';
const boxes=[document.getElementById('d1'),document.getElementById('d2'),document.getElementById('d3'),document.getElementById('d4')];
const hint=document.getElementById('hint');
const attemptsEl=document.getElementById('attempts');
let attempts=0;
boxes[0].focus();
boxes.forEach((box,i)=>{
  box.addEventListener('input',(e)=>{
    const val=e.target.value.replace(/\D/g,'');
    e.target.value=val;
    if(val&&i<3)boxes[i+1].focus();
    const code=boxes.map(b=>b.value).join('');
    if(code.length===4)setTimeout(()=>checkCode(code),200);
  });
  box.addEventListener('keydown',(e)=>{
    if(e.key==='Backspace'&&!box.value&&i>0){boxes[i-1].focus();boxes[i-1].value='';}
  });
  box.addEventListener('focus',()=>box.select());
});
function checkCode(code){
  if(code===CODE){
    boxes.forEach(b=>b.classList.add('correct'));
    hint.textContent='🎉 UNLOCKED!';
    hint.style.color='#22c55e';hint.style.fontWeight='700';hint.style.fontSize='18px';
    for(let i=0;i<30;i++)setTimeout(()=>spawnStar(),i*80);
    setTimeout(()=>{
      document.getElementById('lockScreen').classList.add('hidden');
      setTimeout(()=>{document.getElementById('unlockScreen').classList.add('visible');},300);
    },1200);
  }else{
    attempts++;
    boxes.forEach(b=>b.classList.add('wrong'));
    hint.textContent='Wrong code! Try again...';
    hint.className='hint wrong-msg';
    attemptsEl.textContent='Attempts: '+attempts;
    setTimeout(()=>{
      boxes.forEach(b=>{b.classList.remove('wrong');b.value='';});
      boxes[0].focus();hint.textContent='Type the secret code...';hint.className='hint';
    },800);
  }
}
function spawnStar(){
  const s=document.createElement('div');s.className='star';
  s.textContent=['⭐','✨','💫','🌟'][Math.floor(Math.random()*4)];
  s.style.left=Math.random()*100+'vw';s.style.top='-30px';
  s.style.fontSize=(14+Math.random()*20)+'px';
  s.style.animationDuration=(2+Math.random()*2)+'s';
  document.body.appendChild(s);setTimeout(()=>s.remove(),4000);
}
</script>
