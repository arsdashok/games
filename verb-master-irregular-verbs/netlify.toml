# Netlify configuration for Verb Master.
# Tells Netlify how to serve the static site.

[build]
  publish = "."

# SPA-style routing — every URL falls back to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must NEVER be cached by browser/CDN
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Manifest, icons, JS, CSS — cache for 1 year (filenames will be hashed in prod build)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/src/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
