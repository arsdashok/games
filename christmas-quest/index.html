<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree Quest 🎄</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        :root {
            --bg-grad-start: #0f172a;
            --bg-grad-end: #1e1b4b;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --accent-green: #16a34a;
            --accent-red: #ef4444;
            --accent-gold: #fbbf24;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(to bottom, var(--bg-grad-start), var(--bg-grad-end));
            color: var(--text-color);
            min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            overflow-x: hidden; user-select: none;
        }

        /* Snow */
        .snowflake {
            position: fixed; top: -10px; color: white; opacity: 0.8;
            pointer-events: none; z-index: 1; animation: fall linear forwards;
        }
        @keyframes fall { to { transform: translateY(105vh); } }

        /* Main Container */
        #app {
            width: 100%; max-width: 900px;
            min-height: 90vh;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 24px; padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; align-items: center;
            position: relative; z-index: 10; border: 1px solid #475569;
            box-sizing: border-box;
        }

        h1, h2 { margin: 0 0 15px 0; text-align: center; color: var(--accent-gold); }
        p { text-align: center; font-size: 1.1em; line-height: 1.5; margin-bottom: 20px;}

        /* Buttons */
        .btn {
            background-color: var(--accent-green); color: white; border: none;
            padding: 14px 20px; border-radius: 12px; font-size: 1.1em; font-weight: 800;
            cursor: pointer; width: 100%; margin-top: 10px;
            box-shadow: 0 4px 0 #14532d; transition: transform 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: none; }
        .btn-secondary { background-color: #3b82f6; box-shadow: 0 4px 0 #1d4ed8; }
        .btn:disabled { background-color: #64748b; box-shadow: none; cursor: not-allowed; }
        
        .screen { display: none; width: 100%; flex-direction: column; align-items: center; animation: fadeIn 0.4s; }
        .active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- TREE STYLES --- */
        .tree-wrapper {
            position: relative; width: 300px; height: 340px;
            display: flex; justify-content: center; flex-shrink: 0;
            margin-bottom: 20px;
        }
        .tree-body {
            width: 260px; height: 300px;
            background: linear-gradient(180deg, #16a34a 0%, #14532d 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            position: absolute; bottom: 40px; left: 20px;
            z-index: 5;
        }
        .tree-trunk {
            width: 50px; height: 40px; background: #451a03;
            position: absolute; bottom: 0; left: 125px; border-radius: 4px;
        }
        .ornament {
            position: absolute; font-size: 28px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20; 
            pointer-events: none; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .star-top {
            position: absolute; top: -35px; left: 105px; font-size: 60px;
            filter: drop-shadow(0 0 15px gold); display: none;
            z-index: 30;
            animation: spin 4s infinite linear;
        }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- QUIZ LAYOUT --- */
        .quiz-layout {
            display: flex; flex-direction: row; width: 100%;
            gap: 20px; align-items: flex-start; justify-content: center;
        }
        .quiz-left { display: flex; justify-content: center; align-items: center; }
        .quiz-right { flex: 1; display: flex; flex-direction: column; max-width: 500px; width: 100%; }

        @media (max-width: 768px) {
            .quiz-layout { flex-direction: column; align-items: center; }
            .tree-wrapper { transform: scale(0.8); height: 280px; margin-bottom: -20px; }
            .tree-body { bottom: 30px; } 
        }

        /* Level Badges */
        .stage-badge {
            background: #334155; padding: 15px; margin: 8px 0; border-radius: 12px; width: 100%;
            display: flex; justify-content: space-between; align-items: center; opacity: 0.6;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .stage-badge.unlocked { opacity: 1; cursor: pointer; border-color: var(--accent-gold); background: #1e293b; }
        .stage-badge.unlocked:hover { transform: translateX(5px); }
        .stage-badge.done { background: #064e3b; border-color: var(--accent-green); }

        /* Flashcards & Quiz UI */
        .flashcard {
            background: var(--card-bg); border: 2px solid #475569; border-radius: 15px; padding: 25px;
            text-align: center; width: 100%; max-width: 500px; box-sizing: border-box; margin-bottom: 20px;
        }
        .word-en { font-size: 2.2em; color: var(--accent-gold); font-weight: 900; display: block; margin-bottom: 5px; }
        .word-ru { color: #94a3b8; font-size: 1.2em; display: block; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;}
        .grammar-tip { background: #0f172a; padding: 12px; border-radius: 8px; text-align: left; font-size: 1em; color: #e2e8f0; margin-top: 15px; line-height: 1.4;}

        .option-btn {
            background: white; color: #0f172a; border: none; text-align: left; margin-bottom: 12px;
            padding: 15px; border-radius: 10px; font-size: 1.05em;
            box-shadow: 0 4px 0 #cbd5e1; width: 100%; transition: transform 0.1s;
        }
        .option-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #cbd5e1; }
        .option-btn.selected { background: #fffbeb; box-shadow: 0 4px 0 #fcd34d; border: 2px solid #fcd34d; padding: 13px;}
        .option-btn.correct { background: var(--accent-green); color: white; box-shadow: none; border: none; padding: 15px;}
        .option-btn.wrong { background: var(--accent-red); color: white; box-shadow: none; animation: shake 0.4s; }

        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

    </style>
</head>
<body>

<div id="snow-container"></div>

<div id="app">
    <!-- Intro -->
    <div id="intro-screen" class="screen active">
        <div style="font-size: 5em; filter: drop-shadow(0 0 20px gold);">🎅</div>
        <h1>Christmas Class</h1>
        <p>Choose your level:</p>
        <div style="width: 100%; max-width: 300px;">
            <button class="btn" onclick="initGame('beginner')">Beginner (Level 1)</button>
            <button class="btn btn-secondary" onclick="initGame('elementary')">Elementary (Level 2)</button>
        </div>
    </div>

    <!-- Map (Stage Selection) -->
    <div id="map-screen" class="screen">
        <h2>Your Progress</h2>
        <!-- Tree in Map -->
        <div class="tree-wrapper">
            <div class="tree-trunk"></div>
            <div class="tree-body" id="map-tree">
                <div class="star-top" id="star-map">⭐</div>
            </div>
        </div>

        <div id="stages-list" style="width: 100%; max-width: 400px; margin-bottom: 20px;"></div>
        <button class="btn btn-secondary" style="max-width: 200px;" onclick="location.reload()">Exit</button>
    </div>

    <!-- Study -->
    <div id="study-screen" class="screen">
        <h2>Learn 🧠</h2>
        <div id="flashcard-content" class="flashcard"></div>
        <button class="btn" style="max-width: 300px;" id="study-next" onclick="nextCard()">Next</button>
    </div>

    <!-- Quiz (Split Layout) -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-layout">
            <!-- Left: Tree -->
            <div class="quiz-left">
                <div class="tree-wrapper">
                    <div class="tree-trunk"></div>
                    <div class="tree-body" id="quiz-tree">
                         <div class="star-top" id="star-quiz">⭐</div>
                    </div>
                </div>
            </div>
            
            <!-- Right: Questions -->
            <div class="quiz-right">
                <div style="display: flex; justify-content: space-between; color: #94a3b8; margin-bottom: 10px;">
                    <span id="q-progress">1/10</span>
                    <span>🎄 Quiz</span>
                </div>
                
                <div style="background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #475569; margin-bottom: 20px;">
                    <p id="q-text" style="font-weight: 800; font-size: 1.3em; margin: 0;">?</p>
                </div>

                <div id="options-area"></div>
                
                <p id="feedback-msg" style="height: 25px; font-weight: bold; margin: 10px 0; text-align: center;"></p>
                <button class="btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
            </div>
        </div>
    </div>

    <!-- Win -->
    <div id="win-screen" class="screen">
        <div style="font-size: 4em;">🎁</div>
        <h2>Stage Complete!</h2>
        <p>Look at your tree!</p>
        <button class="btn" style="max-width: 300px;" onclick="showMap()">Back to Menu</button>
    </div>
</div>

<script>
    // --- CONTENT DATABASE ---
    const DB = {
        beginner: [
            {
                id: 'vocab', title: '1. Words 🦌',
                study: [
                    {en: "Present", ru: "Подарок", ex: "I have a present."},
                    {en: "Tree", ru: "Елка", ex: "The tree is green."},
                    {en: "Snowman", ru: "Снеговик", ex: "We make a snowman."},
                    {en: "Reindeer", ru: "Олень", ex: "Santa has a reindeer."},
                    {en: "Santa", ru: "Санта", ex: "Santa is nice."}
                ],
                quiz: [
                    {q: "What is green and has lights? 🎄", opts: ["Tree", "Snowman", "Present"], a: 0},
                    {q: "Translate: 'Снеговик'", opts: ["Santa", "Snowman", "Reindeer"], a: 1},
                    {q: "He brings presents. Who is he? 🎅", opts: ["Reindeer", "Santa", "Snowman"], a: 1},
                    {q: "Translate: 'Подарок'", opts: ["Tree", "Present", "Reindeer"], a: 1},
                    {q: "Rudolph is a famous ___.", opts: ["Santa", "Reindeer", "Tree"], a: 1},
                    {q: "Translate: 'Елка'", opts: ["Tree", "Present", "Snowman"], a: 0},
                    {q: "It is white and made of snow. ⛄", opts: ["Santa", "Reindeer", "Snowman"], a: 2},
                    {q: "Translate: 'Олень'", opts: ["Reindeer", "Present", "Tree"], a: 0},
                    {q: "What do you open on Christmas?", opts: ["Tree", "Present", "Snowman"], a: 1},
                    {q: "Translate: 'Санта'", opts: ["Santa", "Reindeer", "Tree"], a: 0},
                    {q: "Where do we put the star?", opts: ["On the Tree", "On the Present", "On the Reindeer"], a: 0},
                    {q: "He has a red hat.", opts: ["Snowman", "Santa", "Tree"], a: 1}
                ]
            },
            {
                id: 'phrases', title: '2. Phrases 🗣️',
                study: [
                    {en: "Merry Christmas", ru: "Счастливого Рождества", ex: "We say: Merry Christmas!"},
                    {en: "Happy New Year", ru: "С Новым Годом", ex: "See you in January!"},
                    {en: "Put on", ru: "Надевать", ex: "Put on your hat."}
                ],
                quiz: [
                    {q: "Translate: 'Счастливого Рождества'", opts: ["Merry Christmas", "Happy New Year", "Put on"], a: 0},
                    {q: "We say: ___ New Year!", opts: ["Merry", "Happy", "Put"], a: 1},
                    {q: "It is cold. ___ your hat.", opts: ["Put on", "Happy", "Merry"], a: 0},
                    {q: "Translate: 'С Новым Годом'", opts: ["Merry Christmas", "Put on", "Happy New Year"], a: 2},
                    {q: "We say: ___ Christmas!", opts: ["Happy", "Merry", "Put"], a: 1},
                    {q: "Translate: 'Надевать'", opts: ["Merry Christmas", "Put on", "Happy New Year"], a: 1},
                    {q: "___ New Year to you!", opts: ["Happy", "Merry", "Put"], a: 0},
                    {q: "___ on your scarf.", opts: ["Put", "Merry", "Happy"], a: 0},
                    {q: "Merry ___!", opts: ["Christmas", "New Year", "Hat"], a: 0},
                    {q: "Happy ___!", opts: ["Christmas", "New Year", "Hat"], a: 1}
                ]
            },
            {
                id: 'grammar', title: '3. Grammar 📚',
                study: [
                    {en: "I have / He has", ru: "Иметь", tip: "I/You/We/They HAVE. He/She/It HAS."},
                    {en: "He wants", ru: "Он хочет (окончание S)", tip: "He/She/It + Verb(S). He wants, She likes."}
                ],
                quiz: [
                    // FIX: "want" removed to avoid confusion. Distractors are clearly wrong grammatically.
                    {q: "I ___ a present.", opts: ["have", "has", "is"], a: 0},
                    {q: "Santa (He) ___ a bag.", opts: ["have", "has", "am"], a: 1},
                    {q: "She ___ a cookie.", opts: ["want", "wants", "have"], a: 1},
                    {q: "We ___ a tree.", opts: ["have", "has", "wants"], a: 0},
                    {q: "The reindeer (It) ___ a red nose.", opts: ["have", "has", "want"], a: 1},
                    {q: "He ___ to play.", opts: ["want", "wants", "have"], a: 1},
                    {q: "They ___ gifts.", opts: ["have", "has", "wants"], a: 0},
                    {q: "My mom (She) ___ a book.", opts: ["wants", "want", "have"], a: 0},
                    {q: "You ___ a nice hat.", opts: ["have", "has", "wants"], a: 0},
                    {q: "Santa ___ milk.", opts: ["want", "wants", "have"], a: 1}
                ]
            }
        ],
        elementary: [
            {
                id: 'vocab', title: '1. Words 🕯️',
                study: [
                    {en: "Chimney", ru: "Дымоход", ex: "Santa uses the chimney."},
                    {en: "Sleigh", ru: "Сани", ex: "Flying sleigh."},
                    {en: "Stocking", ru: "Рождественский носок", ex: "Put candy in the stocking."},
                    {en: "Elf", ru: "Эльф", ex: "The elf is small."}
                ],
                quiz: [
                    {q: "Translate: 'Дымоход'", opts: ["Sleigh", "Chimney", "Elf"], a: 1},
                    {q: "Santa travels in a ___.", opts: ["Chimney", "Stocking", "Sleigh"], a: 2},
                    {q: "Who helps Santa?", opts: ["Sleigh", "Elf", "Chimney"], a: 1},
                    {q: "Translate: 'Сани'", opts: ["Stocking", "Sleigh", "Elf"], a: 1},
                    {q: "We hang a ___ on the fireplace.", opts: ["Chimney", "Sleigh", "Stocking"], a: 2},
                    {q: "Santa goes down the ___.", opts: ["Chimney", "Elf", "Sleigh"], a: 0},
                    {q: "Translate: 'Рождественский носок'", opts: ["Stocking", "Sleigh", "Chimney"], a: 0},
                    {q: "The ___ makes toys.", opts: ["Elf", "Sleigh", "Stocking"], a: 0},
                    {q: "Translate: 'Эльф'", opts: ["Chimney", "Elf", "Sleigh"], a: 1},
                    {q: "Smoke comes out of the ___.", opts: ["Stocking", "Sleigh", "Chimney"], a: 2}
                ]
            },
            {
                id: 'phrases', title: '2. Phrases ✨',
                study: [
                    {en: "Look forward to", ru: "Ждать с нетерпением", ex: "I look forward to it."},
                    {en: "Take place", ru: "Происходить", ex: "The party takes place at home."},
                    {en: "Wrap presents", ru: "Упаковывать подарки", ex: "Wrap the box."}
                ],
                quiz: [
                    {q: "I look ___ to Christmas.", opts: ["forward", "place", "wrap"], a: 0},
                    {q: "Where does the party take ___?", opts: ["forward", "place", "wrap"], a: 1},
                    {q: "Translate: 'Упаковывать подарки'", opts: ["Take place", "Look forward", "Wrap presents"], a: 2},
                    {q: "I need paper to ___ gifts.", opts: ["wrap", "place", "look"], a: 0},
                    {q: "Translate: 'Ждать с нетерпением'", opts: ["Look forward to", "Take place", "Wrap presents"], a: 0},
                    {q: "When does it take ___?", opts: ["wrap", "place", "forward"], a: 1},
                    {q: "Translate: 'Происходить'", opts: ["Take place", "Look forward", "Wrap"], a: 0},
                    {q: "Let's ___ the presents.", opts: ["wrap", "look", "take"], a: 0},
                    {q: "We look forward ___ the holidays.", opts: ["to", "at", "in"], a: 0},
                    {q: "Did you ___ the present?", opts: ["wrap", "place", "look"], a: 0}
                ]
            },
            {
                id: 'grammar', title: '3. Grammar 🕰️',
                study: [
                    {en: "Past Simple", ru: "Прошлое", tip: "Yesterday I PLAYED. I WENT (go)."},
                    {en: "Future Simple", ru: "Будущее", tip: "Tomorrow I WILL go."}
                ],
                quiz: [
                    {q: "Yesterday I ___ a letter.", opts: ["wrote", "will write", "write"], a: 0},
                    {q: "Tomorrow I ___ buy a gift.", opts: ["will", "went", "did"], a: 0},
                    {q: "Last year we ___ to London.", opts: ["go", "will go", "went"], a: 2},
                    {q: "He ___ a snowman yesterday.", opts: ["built", "will build", "build"], a: 0},
                    {q: "I ___ help you.", opts: ["will", "went", "did"], a: 0},
                    {q: "We ___ happy yesterday.", opts: ["will", "are", "were"], a: 2},
                    {q: "Did you ___ the tree?", opts: ["decorate", "decorated", "will decorate"], a: 0},
                    {q: "I ___ call Santa soon.", opts: ["will", "went", "did"], a: 0},
                    {q: "She ___ not hungry yesterday.", opts: ["was", "will", "is"], a: 0},
                    {q: "They ___ cookies last night.", opts: ["ate", "will eat", "eat"], a: 0}
                ]
            }
        ]
    };

    // --- STATE ---
    let currentLevelData = [];
    let currentStageIndex = 0;
    let currentStage = null;
    let cardIndex = 0;
    let qQueue = [];
    let currentQ = null;
    let selOpt = null;
    let treeState = []; 

    // --- AUDIO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playJingle() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        [880, 1100, 1320, 1760].forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = freq;
            osc.type = 'sine';
            const start = now + (i * 0.05);
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.05, start + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 1.0);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(start);
            osc.stop(start + 1.5);
        });
    }

    // --- LOGIC ---
    function initGame(level) {
        currentLevelData = DB[level];
        treeState = []; 
        renderTreeState('quiz-tree');
        renderTreeState('map-tree');
        document.getElementById('star-quiz').style.display = 'none';
        document.getElementById('star-map').style.display = 'none';
        showMap();
    }

    function showMap() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('map-screen').classList.add('active');
        
        // Sync map tree
        renderTreeState('map-tree');
        
        const list = document.getElementById('stages-list');
        list.innerHTML = '';

        currentLevelData.forEach((stage, idx) => {
            const isUnlocked = idx === 0 || currentLevelData[idx-1].done;
            const isDone = stage.done;
            
            const div = document.createElement('div');
            div.className = `stage-badge ${isUnlocked ? 'unlocked' : ''} ${isDone ? 'done' : ''}`;
            div.innerHTML = `<span>${stage.title}</span> <span>${isDone ? '✅' : (isUnlocked ? '▶' : '🔒')}</span>`;
            
            if(isUnlocked && !isDone) {
                div.onclick = () => startStage(idx);
            }
            list.appendChild(div);
        });

        // Show Star on Map if all done
        if(currentLevelData.every(s => s.done)) {
            document.getElementById('star-map').style.display = 'block';
        }
    }

    function startStage(idx) {
        currentStageIndex = idx;
        currentStage = currentLevelData[idx];
        cardIndex = 0;
        showStudy();
    }

    function showStudy() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('study-screen').classList.add('active');
        renderCard();
    }

    function renderCard() {
        const item = currentStage.study[cardIndex];
        const container = document.getElementById('flashcard-content');
        
        let html = `<span class="word-en">${item.en}</span>`;
        html += `<span class="word-ru">${item.ru}</span>`;
        if(item.ex) html += `<div class="context">"${item.ex}"</div>`;
        if(item.tip) html += `<div class="grammar-tip">💡 ${item.tip}</div>`;
        
        container.innerHTML = html;

        const btn = document.getElementById('study-next');
        const isLast = cardIndex >= currentStage.study.length - 1;
        btn.innerText = isLast ? "Start Quiz!" : "Next";
        btn.onclick = isLast ? startQuiz : nextCard;
    }

    function nextCard() { cardIndex++; renderCard(); }

    function startQuiz() {
        qQueue = JSON.parse(JSON.stringify(currentStage.quiz));
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('quiz-screen').classList.add('active');
        
        renderTreeState('quiz-tree');
        loadQuestion();
    }

    function loadQuestion() {
        if(qQueue.length === 0) {
            currentStage.done = true;
            document.getElementById('win-screen').classList.add('active');
            document.getElementById('quiz-screen').classList.remove('active');
            return;
        }

        currentQ = qQueue.shift();
        selOpt = null;
        
        const total = currentStage.quiz.length;
        const current = total - qQueue.length;
        document.getElementById('q-progress').innerText = `${current}/${total}`;

        document.getElementById('q-text').innerText = currentQ.q;
        document.getElementById('feedback-msg').innerText = '';
        const btn = document.getElementById('check-btn');
        btn.disabled = true; btn.innerText = "Check Answer"; btn.onclick = checkAnswer;

        const area = document.getElementById('options-area');
        area.innerHTML = '';
        currentQ.opts.forEach((txt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.innerText = txt;
            b.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(x => x.classList.remove('selected'));
                b.classList.add('selected');
                selOpt = i;
                btn.disabled = false;
            };
            area.appendChild(b);
        });
    }

    function checkAnswer() {
        const opts = document.querySelectorAll('.option-btn');
        const feedback = document.getElementById('feedback-msg');
        const btn = document.getElementById('check-btn');

        if(selOpt === currentQ.a) {
            opts[selOpt].classList.add('correct');
            feedback.innerText = "Correct! 🎄";
            feedback.style.color = "#22c55e";
            playJingle();
            
            // Add Ornament
            addOrnamentVisual();

            btn.innerText = "Next Question";
            btn.onclick = loadQuestion;
        } else {
            opts[selOpt].classList.add('wrong');
            opts[currentQ.a].classList.add('correct');
            feedback.innerText = "Remember this one!";
            feedback.style.color = "#ef4444";
            qQueue.push(currentQ); // Re-queue
            btn.innerText = "Got it";
            btn.onclick = loadQuestion;
        }
    }

    // --- VISUAL TREE SYSTEM ---
    
    function addOrnamentVisual() {
        const types = ['🔴','🔵','🟡','🟣','🎀','🍬','🔔','❄️','🍪'];
        const type = types[Math.floor(Math.random()*types.length)];
        
        // Tree Body Dimensions: W=260, H=300
        // Triangle shape: Top (50%, 0), Bottom (0, 100), Bottom (100, 100)
        
        const y = Math.random() * 260 + 20; // 20px from bottom to 280px
        
        // Calculate max width at this height Y (linear interpolation)
        // At y=0 (bottom): Width = 260. At y=300 (top): Width = 0.
        const widthAtY = 240 * (1 - (y/300)); 
        
        // Random X centered around 130 (half of 260)
        const xOffset = (Math.random() * widthAtY) - (widthAtY/2);
        const xFinal = 130 + xOffset; // 130 is center

        const ornamentData = { type: type, x: xFinal, y: y };
        treeState.push(ornamentData);
        
        // Render immediately to quiz tree
        renderOrnament(document.getElementById('quiz-tree'), ornamentData, true);
    }

    function renderTreeState(treeId) {
        const container = document.getElementById(treeId);
        // Clean old ornaments
        container.querySelectorAll('.ornament').forEach(el => el.remove());
        
        treeState.forEach(data => {
            renderOrnament(container, data, false);
        });
    }

    function renderOrnament(container, data, animate) {
        const el = document.createElement('div');
        el.className = 'ornament';
        el.innerText = data.type;
        el.style.bottom = data.y + 'px';
        el.style.left = data.x + 'px'; // Absolute inside container
        el.style.transform = 'translateX(-50%)'; // Center pivot
        
        if(!animate) el.style.animation = 'none';
        container.appendChild(el);
    }

    // Snow
    setInterval(() => {
        const c = document.getElementById('snow-container');
        const f = document.createElement('div');
        f.className = 'snowflake';
        f.innerText = '❄';
        f.style.left = Math.random()*100 + 'vw';
        f.style.fontSize = (Math.random()*15+10)+'px';
        f.style.animationDuration = (Math.random()*3+3)+'s';
        c.appendChild(f);
        setTimeout(()=>f.remove(), 6000);
    }, 400);

</script>
