<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>this or is?</title>
<!-- Tobi, reading. Two games for the this / is mix-up (L26, 27 Sept; Oyin: still mixing them in the homework).
     Words are plain black on purpose: on his word cards «is» and «this» are both dark purple,
     so here he has to look at the letters. Audio: the chosen Google UK voice, pre-recorded, plays only on a tap. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EA;--ink:#232323;--soft:#8a7f6a;--line:#eadfc6;--egg:#FFF4DA;--eggline:#E3C27A;
  --green:#43a047;--purple:#5e35b1;--teal:#00897B;--mark:#FFE45C}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Andika','Comic Sans MS',sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
.screen{display:none;min-height:100vh;flex-direction:column;align-items:center;padding:64px 16px 28px;gap:16px;position:relative}
.screen.on{display:flex}
.home{position:absolute;top:12px;left:12px;font-size:26px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px}
h1{font-size:clamp(38px,6vw,58px);margin:0;font-weight:700;text-align:center}
.hint{font-size:17px;color:var(--soft);text-align:center;max-width:640px;margin:0;text-wrap:balance}
/* menu */
.pair{display:flex;gap:clamp(16px,4vw,44px);justify-content:center;flex-wrap:wrap}
.wcard{background:#fff;border:3px solid var(--line);border-radius:22px;padding:10px 30px 8px;min-width:160px;text-align:center;box-shadow:0 5px 0 var(--line)}
.wcard .w{font-size:clamp(66px,12vw,100px);font-weight:700;line-height:1.15}
.wcard mark{background:var(--mark);color:inherit;border-radius:10px;padding:0 3px}
.ear{font-size:24px}
.games{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.gbtn{color:#fff;font-size:clamp(23px,3.6vw,30px);font-weight:700;padding:12px 26px;border-radius:22px;display:flex;align-items:center;gap:12px}
.gbtn img{height:58px}
.gbtn.g1{background:var(--purple);box-shadow:0 6px 0 #3b1f80}
.gbtn.g2{background:var(--teal);box-shadow:0 6px 0 #00574e}
.menu-dino{height:clamp(110px,20vh,160px)}
/* game 1: hear and find */
.dino{position:relative}
.dino img{height:clamp(130px,25vh,210px);display:block}
.bubble{position:absolute;top:2px;right:-78px;background:#fff;border:3px solid var(--line);border-radius:20px;font-size:32px;padding:4px 12px}
@media (max-width:560px){.bubble{top:-38px;right:-6px;font-size:28px}.dino{margin-top:34px}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.hop{animation:hop .45s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.eggs{display:flex;gap:clamp(24px,8vw,90px);justify-content:center}
.slot{position:relative}
.egg{position:relative;width:clamp(148px,30vw,210px);height:clamp(188px,38vw,262px);
  border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;background:var(--egg);border:4px solid var(--eggline);
  box-shadow:0 7px 0 var(--eggline);display:flex;align-items:center;justify-content:center;
  font-size:clamp(54px,10vw,78px);font-weight:700;transition:transform .35s,opacity .35s;overflow:hidden}
.spot{position:absolute;border-radius:50%;background:#F2DDA2}
.egg .w{position:relative}
.egg mark,.choice mark{background:var(--mark);color:inherit;border-radius:8px;padding:0 2px}
.egg.hatch{transform:scale(.3);opacity:0}
.baby{position:absolute;left:0;right:0;bottom:6%;margin:auto;width:84%;opacity:0;transform:scale(.2);
  transition:transform .45s cubic-bezier(.3,1.6,.5,1),opacity .25s;pointer-events:none}
.baby.show{opacity:1;transform:scale(1)}
.wobble{animation:wob .6s}
@keyframes wob{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.nest{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;min-height:84px;width:min(860px,100%);
  background:#f0e2c0;border:3px solid #d9c08a;border-radius:40px 40px 70px 70px;padding:8px 18px}
.nest img{height:64px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* game 2: fill the gap */
.stars{min-height:40px;font-size:32px;letter-spacing:4px}
.stars span{display:inline-block;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.pic{width:clamp(180px,30vw,270px);height:clamp(150px,25vw,230px);background:#fff;border:3px solid var(--line);
  border-radius:22px;display:flex;align-items:center;justify-content:center;padding:12px}
.pic img{max-width:100%;max-height:100%}
.sent{font-size:clamp(38px,6.4vw,60px);font-weight:700;line-height:1.5;text-align:center;max-width:820px}
.gap{display:inline-block;width:2.4em;border-bottom:6px dashed #b9a77a;margin:0 .15em;text-align:center;line-height:1.1;vertical-align:baseline}
.gap.filled{border-bottom:6px solid var(--green)}
.choices{display:flex;gap:clamp(26px,9vw,96px);justify-content:center}
.choice{background:#fff;border:4px solid var(--line);border-radius:22px;font-size:clamp(50px,9vw,72px);font-weight:700;
  min-width:clamp(150px,26vw,190px);padding:4px 24px;box-shadow:0 7px 0 var(--line)}
.after{display:none;gap:20px}
.after.on{display:flex}
.ctrl{font-size:34px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 24px;box-shadow:0 5px 0 var(--line)}
.next{background:var(--green);color:#fff;border-color:#2e7d32;box-shadow:0 5px 0 #2e7d32;font-size:42px;padding:6px 34px}
/* well done */
.done{position:fixed;inset:0;background:rgba(255,248,234,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:10;padding:16px}
.done.on{display:flex}
.done h2{font-size:clamp(46px,8vw,76px);margin:0}
.done .big{height:clamp(150px,30vh,250px)}
.done .row{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.done .stars2{font-size:44px;letter-spacing:6px}
</style>
</head>
<body>

<section class="screen on" id="menu">
  <h1>this or is?</h1>
  <img class="menu-dino" id="menuDino" alt="">
  <div class="pair">
    <button class="wcard" onclick="play('this')"><div class="w"><mark>th</mark>is</div><div class="ear">🔊</div></button>
    <button class="wcard" onclick="play('is')"><div class="w">is</div><div class="ear">🔊</div></button>
  </div>
  <p class="hint">Grown-up: tap a word to hear&nbsp;it.</p>
  <div class="games">
    <button class="gbtn g1" onclick="startG1()"><img id="eggIcon" alt="">Find the egg</button>
    <button class="gbtn g2" onclick="startG2()"><img id="picIcon" alt="">Fill the gap</button>
  </div>
</section>

<section class="screen" id="g1">
  <button class="home" onclick="show('menu')">🏠</button>
  <p class="hint">Tap the dino to hear the word. Then tap the egg with that&nbsp;word.</p>
  <button class="dino" id="dino" onclick="tapDino()"><img id="trex" alt=""><span class="bubble pulse" id="bubble">🔊</span></button>
  <div class="eggs" id="eggs">
    <div class="slot"><button class="egg" onclick="tapEgg(this)"><i class="spot" style="width:22px;height:22px;left:22%;top:16%"></i><i class="spot" style="width:16px;height:16px;right:20%;top:30%"></i><i class="spot" style="width:20px;height:20px;left:30%;bottom:14%"></i><span class="w"></span></button><img class="baby" alt=""></div>
    <div class="slot"><button class="egg" onclick="tapEgg(this)"><i class="spot" style="width:18px;height:18px;right:24%;top:14%"></i><i class="spot" style="width:22px;height:22px;left:18%;top:38%"></i><i class="spot" style="width:16px;height:16px;right:28%;bottom:16%"></i><span class="w"></span></button><img class="baby" alt=""></div>
  </div>
  <div class="nest" id="nest"></div>
</section>

<section class="screen" id="g2">
  <button class="home" onclick="show('menu')">🏠</button>
  <p class="hint">Read it together. Tobi taps the word, then reads the whole sentence. Tap the speaker to&nbsp;check.</p>
  <div class="stars" id="stars"></div>
  <div class="pic"><img id="pic" alt=""></div>
  <div class="sent"><span id="pre"></span><span class="gap" id="gap"></span><span id="post"></span></div>
  <div class="choices" id="choices">
    <button class="choice" onclick="tapChoice(this)"></button>
    <button class="choice" onclick="tapChoice(this)"></button>
  </div>
  <div class="after" id="after">
    <button class="ctrl" onclick="hearG2()">🔊</button>
    <button class="ctrl next" onclick="nextG2()">➜</button>
  </div>
</section>

<div class="done" id="done">
  <img class="big" id="doneDino" alt="">
  <h2>Well done, Tobi!</h2>
  <div class="stars2">⭐⭐⭐</div>
  <div class="row">
    <button class="ctrl next" onclick="again()">Play again</button>
    <button class="ctrl" onclick="show('menu')">🏠</button>
  </div>
</div>

const $ = s => document.querySelector(s);
let audio = null;
function play(key){
  const src = A.snd[key]; if (!src) return;
  try { if (audio) audio.pause(); audio = new Audio(src); audio.play().catch(()=>{}); } catch (e) {}
}
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// no three the same in a row, no long ping-pong (A B A B A)
function runsOK(s){
  for (let i=2;i<s.length;i++) if (s[i]===s[i-1] && s[i]===s[i-2]) return false;
  let alt=1; for (let i=1;i<s.length;i++){ alt = s[i]!==s[i-1] ? alt+1 : 1; if (alt>=5) return false; }
  return true;
}
function balanced(n,x,y){ let s; do { s=shuffle(Array(n/2).fill(x).concat(Array(n/2).fill(y))); } while(!runsOK(s)); return s; }
// which side the right answer sits on: jumbled, and each word appears on both sides
function sidesFor(words){
  let s;
  for (let t=0;t<5000;t++){
    s = balanced(words.length,'L','R');
    const c = {}; words.forEach((w,i)=>{ c[w]=c[w]||{L:0,R:0}; c[w][s[i]]++; });
    if (Object.values(c).every(v=>v.L>=1 && v.R>=1)) return s;
  }
  return s;
}
function show(id){
  document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on', x.id===id));
  $('#done').classList.remove('on');
}

/* ---------- Game 1: hear the word, find the egg ---------- */
const N1 = 10;
let g1 = null;
function startG1(){
  const targets = balanced(N1,'this','is');
  g1 = { targets, sides: sidesFor(targets), i:0, busy:false, heard:false };
  $('#nest').innerHTML = '';
  show('g1'); roundG1();
}
function roundG1(){
  const t = g1.targets[g1.i], other = t==='this' ? 'is' : 'this';
  const words = g1.sides[g1.i]==='L' ? [t,other] : [other,t];
  document.querySelectorAll('#eggs .slot').forEach((slot,k)=>{
    const egg = slot.querySelector('.egg'), baby = slot.querySelector('.baby');
    egg.querySelector('.w').textContent = words[k]; egg.dataset.w = words[k];  // textContent also clears a th cue
    egg.classList.remove('hatch','wobble'); baby.classList.remove('show');
  });
  g1.busy = false; g1.heard = false; $('#bubble').classList.add('pulse');
}
function tapDino(){
  if (!g1) return;
  play(g1.targets[g1.i]); g1.heard = true;
  $('#bubble').classList.remove('pulse');
  const d = $('#dino'); d.classList.remove('hop'); void d.offsetWidth; d.classList.add('hop');
}
function tapEgg(egg){
  if (!g1 || g1.busy) return;
  if (!g1.heard){ hint(); return; }   // listen first: the eggs wait for the dino
  if (egg.dataset.w === g1.targets[g1.i]){
    g1.busy = true;
    const baby = egg.parentNode.querySelector('.baby');
    baby.src = A.babies[g1.i % A.babies.length];
    egg.classList.add('hatch');
    setTimeout(()=>baby.classList.add('show'), 250);
    setTimeout(()=>{
      const img = document.createElement('img'); img.src = baby.src; img.alt = '';
      $('#nest').appendChild(img);
      g1.i++;
      if (g1.i >= N1) finish('g1'); else roundG1();
    }, 1500);
  } else {
    egg.classList.remove('wobble'); void egg.offsetWidth; egg.classList.add('wobble');
    $('#bubble').classList.add('pulse');
    cue(document.querySelectorAll('#eggs .egg'), '.w');
  }
}
function hint(){
  $('#bubble').classList.add('pulse');
  const d = $('#dino'); d.classList.remove('hop'); void d.offsetWidth; d.classList.add('hop');
}
// after a miss, the th of «this» lights up, the same yellow as on the menu
function cue(nodes, sel){
  nodes.forEach(n=>{ if (n.dataset.w==='this'){ (sel ? n.querySelector(sel) : n).innerHTML = '<mark>th</mark>is'; } });
}

/* ---------- Game 2: read the sentence, fill the gap ---------- */
const S2 = [
  {pre:'I can see', post:'car.',       a:'this', pic:'car',   full:'I can see this car.'},
  {pre:'I like',    post:'little dog.', a:'this', pic:'dog',   full:'I like this little dog.'},
  {pre:'I want',    post:'cake.',       a:'this', pic:'cake',  full:'I want this cake.'},
  {pre:'I have',    post:'apple.',      a:'this', pic:'apple', full:'I have this apple.'},
  {pre:'I like',    post:'big ball.',   a:'this', pic:'ball',  full:'I like this big ball.'},
  {pre:'The dog',   post:'funny.',      a:'is',   pic:'dog',   full:'The dog is funny.'},
  {pre:'The car',   post:'small.',      a:'is',   pic:'car',   full:'The car is small.'},
  {pre:'Here',      post:'my cake.',    a:'is',   pic:'cake',  full:'Here is my cake.'},
  {pre:'The apple', post:'little.',     a:'is',   pic:'apple', full:'The apple is little.'},
  {pre:'My ball',   post:'big.',        a:'is',   pic:'ball',  full:'My ball is big.'},
];
function orderG2(){
  for (let t=0;t<20000;t++){
    const o = shuffle(S2.slice());
    if (!runsOK(o.map(x=>x.a))) continue;
    let ok = true; for (let i=1;i<o.length;i++) if (o[i].pic===o[i-1].pic){ ok=false; break; }
    if (ok) return o;
  }
  return S2.slice();
}
let g2 = null;
function startG2(){
  const items = orderG2();
  g2 = { items, sides: sidesFor(items.map(x=>x.a)), i:0, done:false };
  $('#stars').innerHTML = '';
  show('g2'); roundG2();
}
function roundG2(){
  const it = g2.items[g2.i], other = it.a==='this' ? 'is' : 'this';
  $('#pic').src = A.pic[it.pic];
  $('#pre').textContent = it.pre; $('#post').textContent = it.post;
  const gap = $('#gap'); gap.textContent = ' '; gap.classList.remove('filled');
  const words = g2.sides[g2.i]==='L' ? [it.a,other] : [other,it.a];
  document.querySelectorAll('#choices .choice').forEach((c,k)=>{ c.textContent = words[k]; c.dataset.w = words[k]; c.classList.remove('wobble'); });
  $('#choices').style.display = 'flex'; $('#after').classList.remove('on'); g2.done = false;
}
function tapChoice(btn){
  if (!g2 || g2.done) return;
  const it = g2.items[g2.i];
  if (btn.dataset.w === it.a){
    g2.done = true;
    const gap = $('#gap'); gap.textContent = it.a; gap.classList.add('filled');
    $('#choices').style.display = 'none'; $('#after').classList.add('on');
    const s = document.createElement('span'); s.textContent = '⭐'; $('#stars').appendChild(s);
  } else {
    btn.classList.remove('wobble'); void btn.offsetWidth; btn.classList.add('wobble');
    cue(document.querySelectorAll('#choices .choice'));
  }
}
function hearG2(){ if (g2) play(g2.items[g2.i].full); }
function nextG2(){ if (!g2) return; g2.i++; if (g2.i >= g2.items.length) finish('g2'); else roundG2(); }

/* ---------- well done ---------- */
function finish(which){ const d = $('#done'); d.dataset.g = which; d.classList.add('on'); }
function again(){ ($('#done').dataset.g==='g1') ? startG1() : startG2(); }

$('#trex').src = A.trex; $('#menuDino').src = A.trex; $('#doneDino').src = A.trex;
$('#eggIcon').src = A.babies[0]; $('#picIcon').src = A.pic.ball;
</script>
