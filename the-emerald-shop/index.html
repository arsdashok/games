<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Emerald Shop</title>
<style>
  :root{
    --wood:#b07a3c; --wood-d:#8a5c28; --cream:#fff7ea; --ink:#3a2a17;
    --green:#22a447; --green-d:#1c8b3b; --tag:#ffd34d; --tag-d:#e6b52f;
    --panel:#fffdf8; --shadow:rgba(90,60,20,.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#fbe9c4 0%,#f3d59b 60%,#e9c37f 100%);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  .wrap{height:100%;display:flex;flex-direction:column;padding:14px 18px;gap:12px}

  /* ---- header ---- */
  header{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .sign{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(#c98a44,#a86b2f);color:#fff;
    padding:8px 20px;border-radius:16px;border:4px solid #7d4e22;
    box-shadow:0 5px 0 #6b4220,0 8px 14px var(--shadow);
    font-weight:800;font-size:clamp(20px,3.2vw,34px);letter-spacing:.5px;
  }
  .sign .cart{font-size:1.15em}
  .tools{display:flex;align-items:center;gap:10px}
  .wallet{
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border:4px solid var(--green-d);border-radius:16px;padding:8px 18px;
    box-shadow:0 5px 0 var(--green-d),0 8px 14px var(--shadow);
    font-weight:800;font-size:clamp(22px,3.4vw,38px);color:var(--green-d);
  }
  .wallet .em{width:1.15em;height:1.15em}
  .iconbtn{
    width:52px;height:52px;border-radius:14px;border:3px solid #7d4e22;
    background:#f3e2c3;font-size:24px;cursor:pointer;
    box-shadow:0 4px 0 #7d4e22;display:grid;place-items:center;transition:transform .06s}
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d4e22}

  /* ---- main ---- */
  main{flex:1;display:flex;gap:16px;min-height:0}
  .shelves{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
  .shelf{
    flex:1;background:var(--panel);border-radius:20px;padding:10px 14px 22px;
    border:3px solid #e3cfa6;box-shadow:inset 0 -14px 0 #efe0c2,0 6px 16px var(--shadow);
    display:flex;flex-direction:column;min-height:0;position:relative;
  }
  .shelf h2{
    margin:2px 0 6px;font-size:clamp(15px,2vw,22px);color:#a86b2f;
    display:flex;align-items:center;gap:8px;letter-spacing:.5px}
  .row{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;min-height:0}
  .plank{position:absolute;left:14px;right:14px;bottom:12px;height:12px;border-radius:6px;
    background:linear-gradient(#c98a44,#a86b2f);box-shadow:0 3px 0 #7d4e22}

  .item{
    position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    cursor:pointer;border-radius:14px;padding:4px;transition:transform .1s;
  }
  .item:hover{transform:translateY(-4px)}
  .item img{width:100%;height:78%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18));pointer-events:none}
  .price{
    margin-top:2px;background:var(--tag);border:2px solid var(--tag-d);color:#5a3d00;
    font-weight:800;border-radius:10px;padding:2px 10px;font-size:clamp(14px,1.7vw,20px);
    display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 var(--tag-d)}
  .price .em{width:.95em;height:.95em}

  /* ---- basket panel ---- */
  .side{width:min(30%,340px);display:flex;flex-direction:column;gap:12px;min-height:0}
  .basket{
    flex:1;background:var(--panel);border-radius:20px;border:3px solid #e3cfa6;
    box-shadow:0 6px 16px var(--shadow);padding:12px;display:flex;flex-direction:column;min-height:0}
  .basket h2{margin:0 0 8px;font-size:clamp(16px,2vw,22px);color:#a86b2f;display:flex;align-items:center;gap:8px}
  .bgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start;overflow:auto}
  .bcell{position:relative;background:#fbf1dc;border-radius:12px;padding:6px;cursor:pointer;
    aspect-ratio:1/1;display:grid;place-items:center;transition:transform .1s}
  .bcell:hover{transform:scale(1.05)}
  .bcell img{width:82%;height:82%;object-fit:contain}
  .badge{position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;font-weight:800;
    min-width:26px;height:26px;border-radius:14px;display:grid;place-items:center;font-size:15px;
    border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);padding:0 5px}
  .empty{margin:auto;color:#c3ad82;font-weight:700;text-align:center;font-size:15px;line-height:1.4}
  .howmany{
    border:none;cursor:pointer;border-radius:16px;padding:14px;font-family:inherit;
    font-weight:800;font-size:clamp(18px,2.4vw,26px);color:#fff;letter-spacing:.5px;
    background:linear-gradient(#38b6ff,#1f8fd6);box-shadow:0 5px 0 #1874b0,0 8px 14px var(--shadow);
    transition:transform .06s}
  .howmany:active{transform:translateY(4px);box-shadow:0 1px 0 #1874b0}

  /* ---- modal bubble ---- */
  .veil{position:fixed;inset:0;background:rgba(40,25,5,.45);display:none;place-items:center;z-index:40}
  .veil.on{display:grid}
  .bubble{
    background:var(--cream);border:5px solid #c98a44;border-radius:26px;padding:22px 26px 26px;
    width:min(88vw,440px);text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.35);
    transform:scale(.85);animation:pop .18s forwards}
  @keyframes pop{to{transform:scale(1)}}
  .bubble img{width:44%;max-height:150px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
  .frame{font-weight:800;color:#8a5c28;font-size:clamp(18px,2.6vw,24px);margin:6px 0 2px}
  .frame b{color:#3a2a17;text-transform:capitalize}
  .howmuch{font-weight:800;color:#1f8fd6;font-size:clamp(20px,3vw,30px);margin:10px 0 2px;letter-spacing:.5px}
  .bigprice{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;
    font-size:clamp(40px,8vw,68px);color:#1c8b3b;line-height:1}
  .bigprice .em{width:.9em;height:.9em}
  .word{font-size:clamp(18px,2.6vw,26px);color:#a86b2f;font-weight:700;text-transform:capitalize;margin-top:-2px}
  .acts{display:flex;gap:12px;justify-content:center;margin-top:16px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;border-radius:16px;
    padding:12px 22px;font-size:clamp(17px,2.3vw,22px);color:#fff;transition:transform .06s}
  .btn:active{transform:translateY(3px)}
  .buy{background:linear-gradient(#2fc255,#1c8b3b);box-shadow:0 5px 0 #146b2c}
  .buy:active{box-shadow:0 1px 0 #146b2c}
  .buy:disabled{background:#c9c1b2;box-shadow:0 5px 0 #a99f8d;cursor:not-allowed;color:#f3efe6}
  .sell{background:linear-gradient(#ffb03a,#e6912a);box-shadow:0 5px 0 #b9741f}
  .sell:active{box-shadow:0 1px 0 #b9741f}
  .cancel{background:linear-gradient(#f07a7a,#d64f4f);box-shadow:0 5px 0 #ab3a3a}
  .cancel:active{box-shadow:0 1px 0 #ab3a3a}
  .nomoney{color:#d64f4f;font-weight:800;font-size:clamp(16px,2.2vw,20px);margin-top:10px;min-height:1.2em}

  /* ---- how-many overlay ---- */
  .count-pop{
    position:fixed;inset:0;display:none;place-items:center;z-index:50;pointer-events:none}
  .count-pop.on{display:grid}
  .count-card{background:#1f8fd6;color:#fff;border:6px solid #fff;border-radius:28px;
    padding:26px 46px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.4);
    transform:scale(.6);animation:pop .22s forwards}
  .count-card .q{font-weight:800;font-size:clamp(22px,3.4vw,34px);letter-spacing:.5px}
  .count-card .n{font-weight:800;font-size:clamp(70px,14vw,130px);line-height:1}
  .count-card .nw{font-weight:700;font-size:clamp(22px,3.4vw,32px);text-transform:capitalize;opacity:.95}

  /* flying item */
  .fly{position:fixed;z-index:60;pointer-events:none;object-fit:contain;
    transition:all .55s cubic-bezier(.5,-0.3,.4,1)}

  .pulse{animation:pulse .5s ease}
  @keyframes pulse{0%,100%{transform:none}30%{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sign"><span class="cart">🛒</span> The Emerald Shop</div>
    <div class="tools">
      <div class="wallet"><span id="emIcon"></span><span id="emCount">20</span></div>
      <button class="iconbtn" id="resetBtn" title="Restock">↺</button>
    </div>
  </header>

  <main>
    <div class="shelves">
      <section class="shelf"><h2>🍎 Food</h2><div class="row" id="rowFood"></div><div class="plank"></div></section>
      <section class="shelf"><h2>👕 Clothes</h2><div class="row" id="rowClothes"></div><div class="plank"></div></section>
    </div>
    <aside class="side">
      <div class="basket">
        <h2>🧺 My Basket</h2>
        <div class="bgrid" id="bgrid"><div class="empty" id="emptyMsg">Buy something!<br>Tap an item 👆</div></div>
      </div>
      <button class="howmany" id="howManyBtn">HOW MANY? 👀</button>
    </aside>
  </main>
</div>

<!-- buy / sell bubble -->
<div class="veil" id="veil">
  <div class="bubble" id="bubble"></div>
</div>

<!-- how many overlay -->
<div class="count-pop" id="countPop"><div class="count-card" id="countCard"></div></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="emerald" viewBox="0 0 100 100">
    <polygon points="50,4 92,32 78,92 22,92 8,32" fill="#2ee06b" stroke="#0f7a34" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="50,4 92,32 50,46 8,32" fill="#7bf3a6" opacity=".85"/>
    <polygon points="50,46 92,32 78,92 50,70" fill="#22a447"/>
    <polygon points="50,46 8,32 22,92 50,70" fill="#1c8b3b"/>
  </symbol>
</svg>

// price + display config
const CONF = [
  {name:'apple',    price:3 },
  {name:'water',    price:4 },
  {name:'banana',   price:5 },
  {name:'milk',     price:8 },
  {name:'cake',     price:12},
  {name:'hat',      price:7 },
  {name:'shirt',    price:9 },
  {name:'shoes',    price:11},
  {name:'trousers', price:13},
  {name:'jacket',   price:15},
];
const PRICE = Object.fromEntries(CONF.map(c=>[c.name,c.price]));
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten',
 'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const numWord=n=> n<=20 ? WORDS[n] : String(n);
const AN = new Set(['apple']); // a/an article
const art = n => AN.has(n)?'an':'a';
const plural = n => n==='shoes'||n==='trousers' ? n : (n==='milk'||n==='water' ? n : n+'s');

const START=20;
let emeralds=START;
let basket={};       // name -> count

const emIconHTML='<svg class="em" viewBox="0 0 100 100"><use href="#emerald"/></svg>';
const emTag='<svg class="em" viewBox="0 0 100 100"><use href="#emerald"/></svg>';

// ---------- sound removed (silent game) ----------
function say(){}

// ---------- render ----------
function itemTile(name){
  const el=document.createElement('div');
  el.className='item'; el.dataset.name=name;
  el.innerHTML=`<img src="${ITEMS[name].uri}" alt="${name}">
    <div class="price">${emTag}${PRICE[name]}</div>`;
  el.onclick=()=>openBuy(name,el);
  return el;
}
function buildShelves(){
  const f=document.getElementById('rowFood'), c=document.getElementById('rowClothes');
  f.innerHTML='';c.innerHTML='';
  CONF.forEach(cf=>{
    (ITEMS[cf.name].cat==='food'?f:c).appendChild(itemTile(cf.name));
  });
}
function renderWallet(){ document.getElementById('emCount').textContent=emeralds; }
function renderBasket(){
  const g=document.getElementById('bgrid');
  g.innerHTML='';
  const names=Object.keys(basket).filter(n=>basket[n]>0);
  if(!names.length){ g.innerHTML='<div class="empty">Buy something!<br>Tap an item 👆</div>'; return; }
  names.forEach(n=>{
    const cell=document.createElement('div');
    cell.className='bcell'; cell.dataset.name=n;
    cell.innerHTML=`<img src="${ITEMS[n].uri}"><span class="badge">${basket[n]}</span>`;
    cell.onclick=()=>openSell(n,cell);
    g.appendChild(cell);
  });
}

// ---------- buy ----------
function openBuy(name,tileEl){
  const p=PRICE[name], can=emeralds>=p;
  const b=document.getElementById('bubble');
  b.innerHTML=`
    <img src="${ITEMS[name].uri}">
    <div class="frame">I want ${art(name)} <b>${name}</b>.</div>
    <div class="howmuch">HOW MUCH?</div>
    <div class="bigprice">${emIconHTML}${p}</div>
    <div class="word">${numWord(p)}</div>
    <div class="nomoney">${can?'':'Not enough! 💚'}</div>
    <div class="acts">
      <button class="btn buy" ${can?'':'disabled'} id="doBuy">Buy ${emIconHTML.replace('class="em"','class="em" style="width:.9em;height:.9em;vertical-align:-2px"')}${p}</button>
      <button class="btn cancel" id="doCancel">Back</button>
    </div>`;
  document.getElementById('doCancel').onclick=closeVeil;
  if(can) document.getElementById('doBuy').onclick=()=>doBuy(name,tileEl);
  showVeil();
  say(`${art(name)} ${name}. How much? ${numWord(p)}.`);
}
function doBuy(name,tileEl){
  const p=PRICE[name];
  if(emeralds<p) return;
  emeralds-=p;
  basket[name]=(basket[name]||0)+1;
  const bImg=document.querySelector('#bubble img');
  closeVeil();
  renderWallet(); pulse(document.querySelector('.wallet'));
  flyTo(name, bImg, ()=>{ renderBasket(); flashBasketCell(name); });
  say(`${numWord(p)} emeralds. ${plural(name)}: ${numWord(basket[name])}.`);
}

// ---------- sell ----------
function openSell(name,cellEl){
  const p=PRICE[name];
  const b=document.getElementById('bubble');
  b.innerHTML=`
    <img src="${ITEMS[name].uri}">
    <div class="frame">Sell ${art(name)} <b>${name}</b>?</div>
    <div class="bigprice" style="color:#e6912a">+${emIconHTML}${p}</div>
    <div class="word">${numWord(p)}</div>
    <div class="nomoney"></div>
    <div class="acts">
      <button class="btn sell" id="doSell">Sell</button>
      <button class="btn cancel" id="doCancel">Back</button>
    </div>`;
  document.getElementById('doCancel').onclick=closeVeil;
  document.getElementById('doSell').onclick=()=>doSell(name);
  showVeil();
  say(`Sell ${art(name)} ${name}?`);
}
function doSell(name){
  if(!basket[name]) { closeVeil(); return; }
  const p=PRICE[name];
  basket[name]-=1; if(basket[name]<=0) delete basket[name];
  emeralds+=p;
  closeVeil(); renderWallet(); pulse(document.querySelector('.wallet')); renderBasket();
  say(`Plus ${numWord(p)} emeralds.`);
}

// ---------- how many ----------
function totalItems(){ return Object.values(basket).reduce((a,b)=>a+b,0); }
function howMany(){
  const n=totalItems();
  const card=document.getElementById('countCard');
  card.innerHTML=`<div class="q">HOW MANY?</div><div class="n">${n}</div><div class="nw">${numWord(n)}</div>`;
  const pop=document.getElementById('countPop');
  pop.classList.add('on');
  say(n===0 ? 'How many? Zero. Your basket is empty!' : `How many? ${numWord(n)}.`);
  clearTimeout(howMany._t);
  howMany._t=setTimeout(()=>pop.classList.remove('on'),2600);
  pop.onclick=()=>pop.classList.remove('on');
}

// ---------- helpers ----------
function showVeil(){ document.getElementById('veil').classList.add('on'); }
function closeVeil(){ document.getElementById('veil').classList.remove('on'); }
function pulse(el){ if(!el)return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
function flashBasketCell(name){
  const c=document.querySelector(`.bcell[data-name="${name}"]`);
  if(c) pulse(c);
}
function flyTo(name, fromImg, done){
  const target=document.querySelector('.basket');
  if(!fromImg||!target){ done&&done(); return; }
  const s=fromImg.getBoundingClientRect();
  const t=target.getBoundingClientRect();
  const fly=document.createElement('img');
  fly.src=ITEMS[name].uri; fly.className='fly';
  fly.style.left=s.left+'px'; fly.style.top=s.top+'px';
  fly.style.width=s.width+'px'; fly.style.height=s.height+'px';
  document.body.appendChild(fly);
  requestAnimationFrame(()=>{
    fly.style.left=(t.left+t.width/2-30)+'px';
    fly.style.top =(t.top+40)+'px';
    fly.style.width='60px'; fly.style.height='60px'; fly.style.opacity='.2';
  });
  setTimeout(()=>{ fly.remove(); done&&done(); },560);
}
function reset(){
  emeralds=START; basket={};
  renderWallet(); renderBasket(); closeVeil();
  document.getElementById('countPop').classList.remove('on');
  say('New game! You have twenty emeralds.');
}

// ---------- wire up ----------
document.getElementById('emIcon').innerHTML=emIconHTML;
document.getElementById('howManyBtn').onclick=howMany;
document.getElementById('resetBtn').onclick=reset;
document.getElementById('veil').onclick=e=>{ if(e.target.id==='veil') closeVeil(); };
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeVeil(); });

buildShelves(); renderWallet(); renderBasket();
</script>
</body>
</html>
