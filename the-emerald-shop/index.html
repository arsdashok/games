<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Emerald Shop</title>
<style>
  :root{
    --wood:#b07a3c; --cream:#fff7ea; --ink:#3a2a17;
    --green:#22a447; --green-d:#1c8b3b; --tag:#ffd34d; --tag-d:#e6b52f;
    --panel:#fffdf8; --shadow:rgba(90,60,20,.28); --want:#ffb703;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%,#fbe9c4 0%,#f3d59b 60%,#e9c37f 100%);
    overflow:hidden;user-select:none}
  .wrap{height:100%;display:flex;flex-direction:column;padding:10px 14px;gap:9px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .sign{display:flex;align-items:center;gap:10px;background:linear-gradient(#c98a44,#a86b2f);color:#fff;
    padding:6px 18px;border-radius:14px;border:4px solid #7d4e22;
    box-shadow:0 4px 0 #6b4220,0 7px 12px var(--shadow);
    font-weight:800;font-size:clamp(18px,2.8vw,30px)}
  .tools{display:flex;align-items:center;gap:10px}
  .wallet{display:flex;align-items:center;gap:9px;background:var(--panel);
    border:4px solid var(--green-d);border-radius:14px;padding:6px 16px;
    box-shadow:0 4px 0 var(--green-d),0 7px 12px var(--shadow);
    font-weight:800;font-size:clamp(20px,3vw,34px);color:var(--green-d)}
  .wallet .em{width:1.1em;height:1.1em}
  .iconbtn{width:48px;height:48px;border-radius:13px;border:3px solid #7d4e22;background:#f3e2c3;
    font-size:22px;cursor:pointer;box-shadow:0 4px 0 #7d4e22;display:grid;place-items:center;transition:transform .06s}
  .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #7d4e22}

  main{flex:1;display:flex;gap:12px;min-height:0}
  .shelves{flex:1;display:flex;flex-direction:column;gap:9px;min-height:0}
  .shelf{flex:1;background:var(--panel);border-radius:16px;padding:5px 12px 30px;
    border:3px solid #e3cfa6;box-shadow:inset 0 -11px 0 #efe0c2,0 5px 12px var(--shadow);
    display:flex;flex-direction:column;min-height:0;position:relative}
  .shelf h2{margin:1px 0 3px;font-size:clamp(13px,1.7vw,19px);color:#a86b2f;display:flex;align-items:center;gap:7px}
  .row{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;min-height:0}
  .plank{position:absolute;left:12px;right:12px;bottom:7px;height:9px;border-radius:5px;z-index:0;
    background:linear-gradient(#c98a44,#a86b2f);box-shadow:0 3px 0 #7d4e22}

  .item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    cursor:pointer;border-radius:12px;padding:3px;transition:transform .1s}
  .item:hover{transform:translateY(-3px)}
  .item img{width:100%;height:74%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18));pointer-events:none}
  .price{position:relative;z-index:2;margin-top:3px;background:var(--tag);border:2px solid var(--tag-d);color:#5a3d00;font-weight:800;
    border-radius:9px;padding:1px 9px;font-size:clamp(12px,1.5vw,18px);display:flex;align-items:center;gap:4px;
    box-shadow:0 3px 0 var(--tag-d)}
  .price .em{width:.9em;height:.9em}
  .item.want{background:rgba(255,183,3,.16);outline:3px dashed var(--want);outline-offset:-2px;
    border-radius:14px;animation:wantpulse 1.3s ease-in-out infinite}
  @keyframes wantpulse{0%,100%{outline-color:#ffb703}50%{outline-color:#ffd97a}}

  .side{width:min(30%,335px);display:flex;flex-direction:column;gap:10px;min-height:0}
  .list-card{background:linear-gradient(#fff,#fff5df);border-radius:16px;border:3px solid #f0c36b;
    box-shadow:0 5px 12px var(--shadow);padding:9px 11px}
  .list-card h2{margin:0 0 2px;font-size:clamp(14px,1.9vw,20px);color:#c77d0a;display:flex;align-items:center;gap:7px;justify-content:space-between}
  .need{font-size:clamp(12px,1.6vw,15px);color:#8a5c28;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:5px}
  .need .em{width:1em;height:1em}
  .list-items{display:flex;gap:8px}
  .li{flex:1;position:relative;background:#fbf1dc;border-radius:11px;padding:5px;aspect-ratio:1/1;display:grid;place-items:center}
  .li img{width:86%;height:86%;object-fit:contain}
  .li.done{opacity:.55}
  .li.done::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
    font-size:34px;font-weight:900;color:var(--green);text-shadow:0 2px 3px #fff}

  .bag{flex:1;background:var(--panel);border-radius:16px;border:3px solid #e3cfa6;
    box-shadow:0 5px 12px var(--shadow);padding:9px 11px;display:flex;flex-direction:column;min-height:0}
  .bag h2{margin:0 0 6px;font-size:clamp(14px,1.9vw,20px);color:#a86b2f;display:flex;align-items:center;gap:7px}
  .bgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-content:start;overflow:auto}
  .bcell{position:relative;background:#fbf1dc;border-radius:10px;padding:5px;cursor:pointer;aspect-ratio:1/1;
    display:grid;place-items:center;transition:transform .1s}
  .bcell:hover{transform:scale(1.06)}
  .bcell img{width:82%;height:82%;object-fit:contain}
  .badge{position:absolute;top:-5px;right:-5px;background:var(--green);color:#fff;font-weight:800;
    min-width:22px;height:22px;border-radius:12px;display:grid;place-items:center;font-size:13px;
    border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);padding:0 4px}
  .empty{margin:auto;color:#c3ad82;font-weight:700;text-align:center;font-size:13px;line-height:1.4}
  .howmany{border:none;cursor:pointer;border-radius:14px;padding:12px;font-family:inherit;font-weight:800;
    font-size:clamp(16px,2.1vw,23px);color:#fff;letter-spacing:.5px;
    background:linear-gradient(#38b6ff,#1f8fd6);box-shadow:0 5px 0 #1874b0,0 8px 12px var(--shadow);transition:transform .06s}
  .howmany:active{transform:translateY(4px);box-shadow:0 1px 0 #1874b0}

  .veil{position:fixed;inset:0;background:rgba(40,25,5,.45);display:none;place-items:center;z-index:40}
  .veil.on{display:grid}
  .bubble{background:var(--cream);border:5px solid #c98a44;border-radius:24px;padding:20px 24px 22px;
    width:min(88vw,430px);text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.35);transform:scale(.85);animation:pop .18s forwards}
  @keyframes pop{to{transform:scale(1)}}
  .bubble img{width:42%;max-height:140px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
  .frame{font-weight:800;color:#8a5c28;font-size:clamp(17px,2.5vw,23px);margin:6px 0 2px}
  .frame b{color:#3a2a17;text-transform:capitalize}
  .howmuch{font-weight:800;color:#1f8fd6;font-size:clamp(19px,2.8vw,28px);margin:8px 0 2px;letter-spacing:.5px}
  .bigprice{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;
    font-size:clamp(38px,7.5vw,62px);color:#1c8b3b;line-height:1}
  .bigprice .em{width:.9em;height:.9em}
  .word{font-size:clamp(17px,2.5vw,25px);color:#a86b2f;font-weight:700;text-transform:capitalize;margin-top:-2px}
  .word.reveal{cursor:pointer;color:#b98a3a;border:2px dashed #d9b877;border-radius:11px;padding:3px 14px;
    display:inline-block;font-size:clamp(14px,1.9vw,19px);text-transform:none;margin-top:4px}
  .word.reveal:hover{background:#fff4dc}
  .word.reveal.shown{color:#a86b2f;border-color:transparent;background:none;cursor:default;
    text-transform:capitalize;font-size:clamp(17px,2.5vw,25px);padding:0}
  .acts{display:flex;gap:11px;justify-content:center;margin-top:14px}
  .btn{border:none;cursor:pointer;font-family:inherit;font-weight:800;border-radius:15px;padding:11px 20px;
    font-size:clamp(16px,2.1vw,21px);color:#fff;transition:transform .06s;display:flex;align-items:center;gap:6px}
  .btn:active{transform:translateY(3px)}
  .buy{background:linear-gradient(#2fc255,#1c8b3b);box-shadow:0 5px 0 #146b2c}
  .buy:disabled{background:#c9c1b2;box-shadow:0 5px 0 #a99f8d;cursor:not-allowed;color:#f3efe6}
  .sell{background:linear-gradient(#ffb03a,#e6912a);box-shadow:0 5px 0 #b9741f}
  .cancel{background:linear-gradient(#f07a7a,#d64f4f);box-shadow:0 5px 0 #ab3a3a}
  .btn .em{width:.9em;height:.9em}
  .nomoney{color:#d64f4f;font-weight:800;font-size:clamp(15px,2vw,19px);margin-top:9px;min-height:1.1em}

  .count-pop{position:fixed;inset:0;display:none;place-items:center;z-index:50}
  .count-pop.on{display:grid}
  .count-card{background:#1f8fd6;color:#fff;border:6px solid #fff;border-radius:26px;padding:22px 42px;text-align:center;
    box-shadow:0 16px 40px rgba(0,0,0,.4);transform:scale(.6);animation:pop .22s forwards;position:relative;z-index:2}
  .count-card.win{background:linear-gradient(150deg,#22a447,#1c8b3b)}
  .count-card .q{font-weight:800;font-size:clamp(20px,3.2vw,32px);letter-spacing:.5px}
  .count-card .n{font-weight:800;font-size:clamp(64px,13vw,120px);line-height:1}
  .count-card .nw{font-weight:700;font-size:clamp(20px,3.2vw,30px);text-transform:capitalize;opacity:.95}
  .count-card .newlist{margin-top:14px;background:#fff;color:#1c8b3b;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;font-size:clamp(16px,2.2vw,22px);padding:10px 22px;border-radius:14px;box-shadow:0 5px 0 #d9e8dd}
  .count-card .newlist:active{transform:translateY(3px);box-shadow:0 2px 0 #d9e8dd}

  .fly{position:fixed;z-index:60;pointer-events:none;object-fit:contain;transition:all .55s cubic-bezier(.5,-0.3,.4,1)}
  .confetti{position:fixed;top:-30px;z-index:55;font-size:26px;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
  .pulse{animation:pulse .5s ease}
  @keyframes pulse{0%,100%{transform:none}30%{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sign">🛒 The Emerald Shop</div>
    <div class="tools">
      <div class="wallet"><span id="emIcon"></span><span id="emCount">20</span></div>
      <button class="iconbtn" id="resetBtn" title="New game">↺</button>
    </div>
  </header>

  <main>
    <div class="shelves" id="shelves"></div>
    <aside class="side">
      <div class="list-card">
        <h2>🎯 Shopping List <span id="listTot" class="need"></span></h2>
        <div class="list-items" id="listItems"></div>
      </div>
      <div class="bag">
        <h2>🎒 My Bag</h2>
        <div class="bgrid" id="bgrid"></div>
      </div>
      <button class="howmany" id="howManyBtn">HOW MANY? 👀</button>
    </aside>
  </div>
</div>

<div class="veil" id="veil"><div class="bubble" id="bubble"></div></div>
<div class="count-pop" id="countPop"><div class="count-card" id="countCard"></div></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="emerald" viewBox="0 0 100 100">
    <polygon points="50,4 92,32 78,92 22,92 8,32" fill="#2ee06b" stroke="#0f7a34" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="50,4 92,32 50,46 8,32" fill="#7bf3a6" opacity=".85"/>
    <polygon points="50,46 92,32 78,92 50,70" fill="#22a447"/>
    <polygon points="50,46 8,32 22,92 50,70" fill="#1c8b3b"/>
  </symbol>
</svg>

const PRICE = {
  apple:1, water:2, banana:3, milk:6, cake:10,
  hat:7, shirt:9, shoes:12, trousers:15, jacket:17,
  ball:5, teddy:11, car:13, bike:14, toy:16, sword:18, pickaxe:20
};
const SHELVES = [
  {label:'🍎 Food',    items:['apple','water','banana','milk','cake']},
  {label:'👕 Clothes', items:['hat','shirt','shoes','trousers','jacket']},
  {label:'🧸 Toys',    items:['ball','teddy','car','bike','toy','sword','pickaxe']},
];
const WORDS=['zero','one','two','three','four','five','six','seven','eight','nine','ten',
 'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const numWord=n=> n<=20 ? WORDS[n] : String(n);
const NO_ART=new Set(['shoes','trousers','milk','water']);
const PLURAL=new Set(['shoes','trousers']);
const AN=new Set(['apple']);
const art=n=> NO_ART.has(n)?'' : (AN.has(n)?'an ':'a ');

const START=20;
let emeralds=START, bag={}, list=[];
const emIconHTML='<svg class="em" viewBox="0 0 100 100"><use href="#emerald"/></svg>';
function say(){}  // sound removed (silent game)

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ---------- shopping list ----------
function newList(){
  const all=Object.keys(PRICE);
  for(let t=0;t<500;t++){
    const pick=shuffle(all).slice(0,3);
    const tot=pick.reduce((s,n)=>s+PRICE[n],0);
    const teen=pick.some(n=>PRICE[n]>=11&&PRICE[n]<=15);
    if(tot<=START && teen){ list=pick.map(n=>({name:n,done:false})); return; }
  }
  list=[{name:'teddy',done:false},{name:'apple',done:false},{name:'water',done:false}];
}
function listTotal(){ return list.reduce((s,i)=>s+PRICE[i.name],0); }
function wantedSet(){ return new Set(list.filter(i=>!i.done).map(i=>i.name)); }

// ---------- render ----------
function itemTile(name){
  const el=document.createElement('div');
  el.className='item'+(wantedSet().has(name)?' want':'');
  el.dataset.name=name;
  el.innerHTML=`<img src="${ITEMS[name].uri}" alt="${name}"><div class="price">${emIconHTML}${PRICE[name]}</div>`;
  el.onclick=()=>openBuy(name);
  return el;
}
function buildShelves(){
  const root=document.getElementById('shelves'); root.innerHTML='';
  SHELVES.forEach(sh=>{
    const s=document.createElement('section'); s.className='shelf';
    const h=document.createElement('h2'); h.textContent=sh.label; s.appendChild(h);
    const row=document.createElement('div'); row.className='row';
    sh.items.forEach(n=>row.appendChild(itemTile(n)));
    s.appendChild(row);
    const pl=document.createElement('div'); pl.className='plank'; s.appendChild(pl);
    root.appendChild(s);
  });
}
function renderWallet(){ document.getElementById('emCount').textContent=emeralds; }
function renderList(){
  document.getElementById('listTot').innerHTML=`${emIconHTML}${listTotal()}`;
  const box=document.getElementById('listItems'); box.innerHTML='';
  list.forEach(i=>{
    const d=document.createElement('div'); d.className='li'+(i.done?' done':'');
    d.innerHTML=`<img src="${ITEMS[i.name].uri}" alt="${i.name}">`;
    box.appendChild(d);
  });
}
function renderBag(){
  const g=document.getElementById('bgrid'); g.innerHTML='';
  const names=Object.keys(bag).filter(n=>bag[n]>0);
  if(!names.length){ g.innerHTML='<div class="empty">Your bag is empty.<br>Buy your list! 👆</div>'; return; }
  names.forEach(n=>{
    const c=document.createElement('div'); c.className='bcell'; c.dataset.name=n;
    c.innerHTML=`<img src="${ITEMS[n].uri}"><span class="badge">${bag[n]}</span>`;
    c.onclick=()=>openBag(n);
    g.appendChild(c);
  });
}
function renderAll(){ buildShelves(); renderWallet(); renderList(); renderBag(); }

// ---------- buy ----------
function openBuy(name){
  const p=PRICE[name], can=emeralds>=p, onList=list.some(i=>i.name===name&&!i.done);
  const b=document.getElementById('bubble');
  b.innerHTML=`
    <img src="${ITEMS[name].uri}">
    <div class="frame">I want ${art(name)}<b>${name}</b>.</div>
    <div class="howmuch">HOW MUCH?</div>
    <div class="bigprice">${emIconHTML}${p}</div>
    <div class="word reveal" id="revealWord">say it, then tap 👂</div>
    <div class="nomoney">${can?(onList?'On your list! ⭐':''):'Not enough! 💚'}</div>
    <div class="acts">
      <button class="btn buy" ${can?'':'disabled'} id="doBuy">Buy ${emIconHTML}${p}</button>
      <button class="btn cancel" id="doCancel">Back</button>
    </div>`;
  document.getElementById('doCancel').onclick=closeVeil;
  if(can) document.getElementById('doBuy').onclick=()=>doBuy(name);
  const rw=document.getElementById('revealWord');
  rw.onclick=()=>{ rw.textContent=numWord(p); rw.classList.add('shown'); };
  showVeil();
}
function doBuy(name){
  const p=PRICE[name]; if(emeralds<p) return;
  emeralds-=p; bag[name]=(bag[name]||0)+1;
  const li=list.find(i=>i.name===name&&!i.done); if(li) li.done=true;
  const bImg=document.querySelector('#bubble img');
  closeVeil(); renderWallet(); pulse(document.querySelector('.wallet'));
  flyTo(name,bImg,()=>{ renderBag(); buildShelves(); renderList(); flashBag(name);
    if(list.length && list.every(i=>i.done)) setTimeout(celebrate,350);
  });
}

// ---------- bag: "This is my..." + sell ----------
function openBag(name){
  const p=PRICE[name];
  const b=document.getElementById('bubble');
  b.innerHTML=`
    <img src="${ITEMS[name].uri}">
    <div class="frame">${PLURAL.has(name)?'These are':'This is'} my <b>${name}</b>!</div>
    <div class="word" style="color:#8a5c28;text-transform:none">Sell it back?</div>
    <div class="bigprice" style="color:#e6912a;font-size:clamp(30px,6vw,48px)">+${emIconHTML}${p}</div>
    <div class="nomoney"></div>
    <div class="acts">
      <button class="btn sell" id="doSell">Sell ${emIconHTML}${p}</button>
      <button class="btn cancel" id="doCancel">Keep it</button>
    </div>`;
  document.getElementById('doCancel').onclick=closeVeil;
  document.getElementById('doSell').onclick=()=>doSell(name);
  showVeil();
}
function doSell(name){
  if(!bag[name]){ closeVeil(); return; }
  bag[name]-=1; if(bag[name]<=0) delete bag[name];
  emeralds+=PRICE[name];
  closeVeil(); renderWallet(); pulse(document.querySelector('.wallet')); renderBag();
}

// ---------- how many ----------
function totalItems(){ return Object.values(bag).reduce((a,b)=>a+b,0); }
function howMany(){
  const n=totalItems();
  const card=document.getElementById('countCard'); card.className='count-card';
  card.innerHTML=`<div class="q">HOW MANY?</div><div class="n">${n}</div><div class="nw">${numWord(n)}</div>`;
  const pop=document.getElementById('countPop'); pop.classList.add('on');
  clearTimeout(howMany._t); howMany._t=setTimeout(()=>pop.classList.remove('on'),2600);
  pop.onclick=e=>{ if(e.target===pop) pop.classList.remove('on'); };
}

// ---------- celebrate (list complete) ----------
function celebrate(){
  const n=totalItems();
  confettiBurst();
  const card=document.getElementById('countCard'); card.className='count-card win';
  card.innerHTML=`<div class="q">🎉 YOU GOT EVERYTHING!</div>
    <div class="q" style="font-size:.7em;opacity:.9">How many?</div>
    <div class="n">${n}</div><div class="nw">${numWord(n)}</div>
    <button class="newlist" id="newListBtn">New List ▶</button>`;
  const pop=document.getElementById('countPop'); pop.classList.add('on');
  document.getElementById('newListBtn').onclick=()=>{
    pop.classList.remove('on'); emeralds=START; bag={}; newList(); renderAll();
  };
  pop.onclick=e=>{ if(e.target===pop) pop.classList.remove('on'); };
}
function confettiBurst(){
  const em=['💚','⭐','🎉','🟢','✨'];
  for(let i=0;i<26;i++){
    const s=document.createElement('div'); s.className='confetti';
    s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    s.style.fontSize=(18+Math.random()*20)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3000);
  }
}

// ---------- helpers ----------
function showVeil(){ document.getElementById('veil').classList.add('on'); }
function closeVeil(){ document.getElementById('veil').classList.remove('on'); }
function pulse(el){ if(!el)return; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
function flashBag(name){ const c=document.querySelector(`.bcell[data-name="${name}"]`); if(c) pulse(c); }
function flyTo(name,fromImg,done){
  const target=document.querySelector('.bag');
  if(!fromImg||!target){ done&&done(); return; }
  const s=fromImg.getBoundingClientRect(), t=target.getBoundingClientRect();
  const fly=document.createElement('img'); fly.src=ITEMS[name].uri; fly.className='fly';
  fly.style.left=s.left+'px'; fly.style.top=s.top+'px'; fly.style.width=s.width+'px'; fly.style.height=s.height+'px';
  document.body.appendChild(fly);
  requestAnimationFrame(()=>{ fly.style.left=(t.left+t.width/2-28)+'px'; fly.style.top=(t.top+34)+'px';
    fly.style.width='56px'; fly.style.height='56px'; fly.style.opacity='.2'; });
  setTimeout(()=>{ fly.remove(); done&&done(); },560);
}
function reset(){ emeralds=START; bag={}; newList(); renderAll(); closeVeil();
  document.getElementById('countPop').classList.remove('on'); }

document.getElementById('emIcon').innerHTML=emIconHTML;
document.getElementById('howManyBtn').onclick=howMany;
document.getElementById('resetBtn').onclick=reset;
document.getElementById('veil').onclick=e=>{ if(e.target.id==='veil') closeVeil(); };
window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeVeil(); });

newList(); renderAll();
</script>
</body>
</html>
